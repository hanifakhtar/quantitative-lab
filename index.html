  <script>
/* Data materi asli dari Quantitative Research Methods Lab v1.8.1, dikonversi dari CSV/R. */
window.QRM_DATA = {"glossary":[{"key":"research_objective","term_id":"Tujuan penelitian","term_en":"research objective","definition":"Hal utama yang ingin dijawab penelitian, misalnya mendeskripsikan, membandingkan, menguji hubungan, memprediksi, atau mengevaluasi intervensi.","example":"Jika tujuan berubah, desain dan analisis yang paling sesuai juga dapat berubah."},{"key":"hypothesis","term_id":"Hipotesis","term_en":"hypothesis","definition":"Pernyataan yang dapat diuji tentang pola hubungan, perbedaan, atau efek yang diharapkan. Hipotesis tidak wajib untuk semua penelitian deskriptif atau eksploratif.","example":"Contoh: mahasiswa dengan self-efficacy lebih tinggi diperkirakan memiliki engagement lebih tinggi."},{"key":"estimand","term_id":"Besaran yang ingin diestimasi","term_en":"estimand","definition":"Nilai utama yang ingin diketahui dari analisis, misalnya perbedaan rata-rata dua kelompok, korelasi, odds ratio, atau efek intervensi.","example":"Menentukan besaran utama membantu memilih analisis dan cara melaporkan hasil."},{"key":"population","term_id":"Populasi sasaran","term_en":"target population","definition":"Kelompok yang ingin menjadi sasaran kesimpulan penelitian. Populasi sasaran dapat lebih luas daripada orang yang benar-benar dapat direkrut.","example":"Misalnya seluruh mahasiswa S1 Indonesia, sedangkan sampel mungkin hanya berasal dari beberapa kampus."},{"key":"predictor","term_id":"Prediktor","term_en":"predictor","definition":"Variabel yang digunakan untuk menjelaskan atau memprediksi outcome. Menjadi prediktor tidak berarti otomatis menjadi penyebab.","example":"Self-efficacy dapat menjadi prediktor academic engagement."},{"key":"outcome","term_id":"Outcome / variabel hasil","term_en":"outcome","definition":"Variabel hasil yang ingin dideskripsikan, dibandingkan, dijelaskan, atau diprediksi.","example":"IPK dapat menjadi outcome ketika peneliti ingin memprediksi prestasi akademik."},{"key":"covariate","term_id":"Kovariat","term_en":"covariate","definition":"Variabel tambahan yang dimasukkan ke model karena alasan teori atau desain, misalnya untuk menyesuaikan perbedaan awal.","example":"Usia dapat dimasukkan sebagai kovariat jika ada alasan substantif yang jelas."},{"key":"confounder","term_id":"Variabel perancu","term_en":"confounder","definition":"Variabel yang berkaitan dengan paparan/prediktor dan outcome sehingga dapat membuat hubungan keduanya tampak berbeda dari keadaan sebenarnya.","example":"Pada penelitian observasional, status sosial ekonomi dapat menjadi perancu pada hubungan tertentu."},{"key":"mediator","term_id":"Mediator","term_en":"mediator","definition":"Variabel yang secara teori berada pada jalur antara prediktor dan outcome. Analisis mediasi saja tidak otomatis membuktikan mekanisme sebab-akibat.","example":"X → mediator → Y adalah hipotesis mekanisme yang masih membutuhkan dukungan desain dan teori."},{"key":"moderator","term_id":"Moderator","term_en":"moderator","definition":"Variabel yang membuat kekuatan atau arah hubungan berbeda pada kelompok atau nilai tertentu.","example":"Hubungan stres dan burnout mungkin berbeda menurut dukungan sosial."},{"key":"cluster","term_id":"Variabel pengelompokan","term_en":"cluster variable","definition":"Variabel yang menunjukkan bahwa beberapa peserta berada dalam kelompok yang sama, misalnya siswa dalam kelas atau karyawan dalam unit kerja.","example":"Peserta dalam kelompok yang sama sering lebih mirip sehingga analisis perlu memperhitungkannya."},{"key":"intervention","term_id":"Intervensi","term_en":"intervention","definition":"Perlakuan, program, kebijakan, atau kondisi yang sengaja diberikan atau diatur oleh peneliti untuk dibandingkan.","example":"Program konseling baru dibandingkan dengan layanan biasa."},{"key":"random_assignment","term_id":"Penempatan acak","term_en":"random assignment","definition":"Proses menempatkan peserta atau unit penelitian secara acak ke kondisi. Ini berbeda dari random sampling, yaitu cara memilih peserta dari populasi.","example":"Penempatan acak membantu membuat kelompok lebih sebanding pada awal penelitian."},{"key":"cross_sectional","term_id":"Cross-sectional","term_en":"cross-sectional","definition":"Desain yang mengukur variabel pada satu periode atau satu titik waktu utama.","example":"Survei self-esteem dan well-being yang dilakukan satu kali adalah contoh sederhana."},{"key":"longitudinal","term_id":"Longitudinal","term_en":"longitudinal","definition":"Desain yang mengukur variabel pada lebih dari satu waktu sehingga perubahan atau urutan waktu dapat dipelajari.","example":"Mengukur burnout setiap bulan selama satu tahun."},{"key":"quasi_experiment","term_id":"Quasi-experiment","term_en":"quasi-experiment","definition":"Penelitian yang mengevaluasi intervensi atau kondisi tetapi tidak menggunakan penempatan acak yang memadai.","example":"Dua sekolah yang sudah memakai program berbeda kemudian dibandingkan."},{"key":"sampling","term_id":"Pengambilan sampel","term_en":"sampling","definition":"Cara memilih atau merekrut sebagian anggota populasi untuk ikut penelitian. Cara sampling memengaruhi siapa yang terwakili dan batas generalisasi.","example":"Convenience sampling dan simple random sampling memiliki konsekuensi yang berbeda."},{"key":"sampling_frame","term_id":"Kerangka sampel","term_en":"sampling frame","definition":"Daftar atau sumber yang digunakan untuk mengenali anggota populasi yang dapat dipilih.","example":"Daftar mahasiswa aktif dapat menjadi kerangka sampel jika lengkap dan dapat diakses."},{"key":"sample_size","term_id":"Ukuran sampel","term_en":"sample size","definition":"Jumlah peserta atau unit analisis yang direncanakan. Tidak ada satu angka minimum yang berlaku untuk semua penelitian.","example":"Ukuran sampel perlu dijustifikasi sesuai tujuan, desain, analisis, dan ketepatan yang diinginkan."},{"key":"power","term_id":"Power","term_en":"statistical power","definition":"Peluang desain penelitian mendeteksi efek tertentu jika efek tersebut memang ada, berdasarkan asumsi yang dipakai saat perencanaan.","example":"Power 80% tidak berarti ada peluang 80% hipotesis penelitian benar."},{"key":"effect_size","term_id":"Ukuran efek","term_en":"effect size","definition":"Ukuran besar-kecilnya hubungan, perbedaan, atau efek. Nilai ini membantu menilai makna hasil, bukan hanya signifikansi statistik.","example":"Contohnya Cohen d, korelasi r, odds ratio, atau perbedaan rata-rata."},{"key":"margin_of_error","term_id":"Batas kesalahan","term_en":"margin of error","definition":"Batas ketidakpastian yang ditargetkan ketika ingin mengestimasi nilai, misalnya proporsi populasi.","example":"Batas kesalahan ±5% berarti peneliti menargetkan estimasi yang cukup sempit sesuai asumsi perhitungannya."},{"key":"fpc","term_id":"Koreksi populasi terbatas","term_en":"finite population correction (FPC)","definition":"Penyesuaian ukuran sampel ketika populasi jumlahnya jelas, sampling dilakukan tanpa memilih orang yang sama lagi, dan sampel mengambil bagian yang cukup besar dari populasi.","example":"FPC tidak memperbaiki bias pada convenience sampling."},{"key":"deff","term_id":"Efek desain","term_en":"design effect (DEFF)","definition":"Perbandingan ketidakpastian pada desain sampling yang digunakan dengan simple random sampling. Cluster sampling sering meningkatkan DEFF karena anggota satu cluster dapat saling mirip.","example":"DEFF harus diperkirakan dari desain atau data yang relevan, bukan selalu diasumsikan sama."},{"key":"reliability","term_id":"Reliabilitas / ketepatan skor","term_en":"reliability / precision","definition":"Seberapa konsisten atau tepat skor dihasilkan pada kondisi yang relevan. Reliabilitas yang baik tidak otomatis membuktikan validitas.","example":"Cronbach alpha hanya salah satu indikator dan mempunyai asumsi serta keterbatasan."},{"key":"validity","term_id":"Bukti validitas","term_en":"validity evidence","definition":"Bukti yang mendukung interpretasi dan penggunaan skor untuk tujuan tertentu. Validitas bukan label permanen yang melekat pada instrumen di semua konteks.","example":"Bukti yang relevan dapat mencakup isi, struktur internal, hubungan dengan variabel lain, dan proses respons."},{"key":"fairness","term_id":"Keadilan pengukuran","term_en":"fairness","definition":"Pertimbangan apakah tes atau prosedur pengukuran memberikan kesempatan dan interpretasi yang adil bagi kelompok yang relevan.","example":"Bahasa, aksesibilitas, budaya, dan fungsi item dapat menjadi bagian evaluasi fairness."},{"key":"confidence_interval","term_id":"Interval kepercayaan","term_en":"confidence interval","definition":"Rentang estimasi yang menunjukkan ketidakpastian berdasarkan prosedur statistik tertentu.","example":"Interval yang lebar menunjukkan estimasi kurang presisi dibanding interval yang sempit pada skala yang sama."},{"key":"assumption","term_id":"Asumsi model","term_en":"model assumption","definition":"Kondisi yang diperlukan agar model statistik mempunyai interpretasi atau sifat yang diharapkan. Tidak semua asumsi dinilai dengan satu uji lulus/gagal.","example":"Pada regresi linear, bentuk hubungan dan struktur residual perlu diperiksa sesuai tujuan model."},{"key":"diagnostic","term_id":"Pemeriksaan diagnostik","term_en":"diagnostic check","definition":"Pemeriksaan terhadap data dan model untuk menemukan pola yang dapat mengganggu interpretasi, misalnya outlier berpengaruh atau heteroskedastisitas.","example":"Pemeriksaan residual adalah salah satu contoh diagnostic check."},{"key":"missing_data","term_id":"Data hilang","term_en":"missing data","definition":"Nilai yang seharusnya tersedia tetapi tidak tercatat. Cara menanganinya bergantung pada pola, alasan, dan banyaknya data yang hilang.","example":"Menghapus semua kasus yang memiliki data hilang tidak selalu menjadi pilihan terbaik."},{"key":"validation","term_id":"Validasi model","term_en":"model validation","definition":"Proses memeriksa apakah model, terutama model prediksi, tetap bekerja pada data yang tidak dipakai untuk membangunnya atau melalui resampling yang tepat.","example":"Cross-validation dapat digunakan untuk memperkirakan kinerja prediksi pada data baru."},{"key":"preregistration","term_id":"Preregistrasi","term_en":"preregistration","definition":"Mendokumentasikan rencana penelitian dan analisis sebelum melihat hasil utama. Tujuannya membantu membedakan analisis yang direncanakan dari analisis eksploratif.","example":"Preregistrasi tidak menjamin penelitian benar, tetapi meningkatkan transparansi keputusan."},{"key":"multiplicity","term_id":"Banyak pengujian","term_en":"multiple testing / multiplicity","definition":"Masalah yang muncul ketika banyak hipotesis, outcome, atau perbandingan diuji sehingga peluang mendapatkan hasil signifikan secara kebetulan dapat meningkat.","example":"Rencanakan analisis utama dan cara menangani banyak pengujian jika relevan."}],"examples":[{"id":"assoc_selfeff","label":"Hubungan self-efficacy dan prestasi","question":"Apakah academic self-efficacy berhubungan dengan academic achievement pada mahasiswa S1?","objective":"Associate","population":"Mahasiswa S1 di Universitas X","hypothesis":"Semakin tinggi academic self-efficacy, semakin tinggi academic achievement.","predictor":"Academic self-efficacy","predictor_scale":"Continuous","groups":"2","outcome":"Academic achievement","outcome_scale":"Continuous","outcome_categories":"","observations":"Independent","intervention":"No","randomized":"Not applicable","timepoints":"1","same_participants":"No","sampling_method":"Convenience sampling","target_population":"Mahasiswa S1 di Universitas X","accessible_population":"Mahasiswa aktif yang dapat dijangkau melalui kelas yang berpartisipasi","inclusion_criteria":"Mahasiswa aktif S1 dan bersedia mengikuti penelitian secara sukarela","exclusion_criteria":"Respons ganda atau tidak menyelesaikan outcome utama","recruitment_procedure":"Undangan penelitian disampaikan melalui kelas yang bersedia berpartisipasi","predictor_measure":"Skala academic self-efficacy yang memiliki bukti validitas yang relevan","outcome_measure":"IPK semester dari catatan akademik atau laporan partisipan","additional_variables":""},{"id":"compare_gender","label":"Perbandingan burnout dua kelompok","question":"Apakah academic burnout berbeda antara mahasiswa laki-laki dan perempuan di Universitas X?","objective":"Compare","population":"Mahasiswa S1 di Universitas X","hypothesis":"Terdapat perbedaan academic burnout antara dua kelompok jenis kelamin yang dibandingkan.","predictor":"Jenis kelamin","predictor_scale":"Binary","groups":"2","outcome":"Academic burnout","outcome_scale":"Continuous","outcome_categories":"","observations":"Independent","intervention":"No","randomized":"Not applicable","timepoints":"1","same_participants":"No","sampling_method":"Stratified random sampling","target_population":"Mahasiswa S1 di Universitas X","accessible_population":"Mahasiswa aktif pada semester berjalan","inclusion_criteria":"Mahasiswa aktif yang memenuhi kriteria usia penelitian dan memberikan persetujuan","exclusion_criteria":"Data identitas kelompok atau outcome utama tidak lengkap","recruitment_procedure":"Peserta dipilih dari daftar mahasiswa aktif dengan strata yang telah ditentukan","predictor_measure":"Pertanyaan demografis yang didefinisikan sesuai kebutuhan studi","outcome_measure":"Skala academic burnout yang sesuai dengan populasi mahasiswa","additional_variables":""},{"id":"compare_four","label":"Perbandingan stres pada empat angkatan","question":"Apakah academic stress berbeda antara mahasiswa tahun pertama, kedua, ketiga, dan keempat?","objective":"Compare","population":"Mahasiswa S1 di Fakultas X","hypothesis":"Rata-rata academic stress berbeda setidaknya pada satu angkatan.","predictor":"Tahun studi","predictor_scale":"Categorical","groups":"4","outcome":"Academic stress","outcome_scale":"Continuous","outcome_categories":"","observations":"Independent","intervention":"No","randomized":"Not applicable","timepoints":"1","same_participants":"No","sampling_method":"Stratified random sampling","target_population":"Mahasiswa S1 Fakultas X","accessible_population":"Mahasiswa aktif tahun pertama sampai keempat","inclusion_criteria":"Mahasiswa aktif pada salah satu dari empat tahun studi","exclusion_criteria":"Tidak menyelesaikan pengukuran academic stress","recruitment_procedure":"Pengambilan sampel dilakukan per strata tahun studi","predictor_measure":"Tahun studi berdasarkan data akademik","outcome_measure":"Skala academic stress","additional_variables":""},{"id":"predict_multi","label":"Prediksi burnout dengan beberapa prediktor","question":"Seberapa baik self-efficacy, social support, dan usia memprediksi academic burnout?","objective":"Predict","population":"Mahasiswa S1 di Universitas X","hypothesis":"Self-efficacy dan social support yang lebih tinggi diperkirakan berkaitan dengan burnout yang lebih rendah setelah mempertimbangkan usia.","predictor":"Academic self-efficacy","predictor_scale":"Continuous","groups":"2","outcome":"Academic burnout","outcome_scale":"Continuous","outcome_categories":"","observations":"Independent","intervention":"No","randomized":"Not applicable","timepoints":"1","same_participants":"No","sampling_method":"Convenience sampling","target_population":"Mahasiswa S1 di Universitas X","accessible_population":"Mahasiswa yang dapat dijangkau melalui kelas dan kanal kampus","inclusion_criteria":"Mahasiswa aktif S1 berusia minimal 18 tahun","exclusion_criteria":"Respons ganda atau data outcome utama tidak tersedia","recruitment_procedure":"Undangan penelitian disebarkan melalui kelas dan kanal informasi kampus","predictor_measure":"Skala academic self-efficacy","outcome_measure":"Skala academic burnout","additional_variables":"Social support|Additional predictor|Continuous|;;Usia|Covariate|Continuous|"},{"id":"predict_dropout","label":"Prediksi risiko dropout","question":"Seberapa baik academic engagement, IPK, dan financial stress memprediksi kemungkinan mahasiswa dropout?","objective":"Predict","population":"Mahasiswa tahun pertama Universitas X","hypothesis":"Engagement dan IPK yang lebih rendah serta financial stress yang lebih tinggi diperkirakan terkait dengan peluang dropout yang lebih tinggi.","predictor":"Academic engagement","predictor_scale":"Continuous","groups":"2","outcome":"Status dropout","outcome_scale":"Binary","outcome_categories":"2","observations":"Independent","intervention":"No","randomized":"Not applicable","timepoints":"1","same_participants":"No","sampling_method":"Total sampling / census","target_population":"Mahasiswa tahun pertama Universitas X","accessible_population":"Seluruh mahasiswa tahun pertama pada cohort yang diteliti","inclusion_criteria":"Terdaftar sebagai mahasiswa tahun pertama pada awal periode observasi","exclusion_criteria":"Status akademik akhir tidak dapat diverifikasi","recruitment_procedure":"Data diperoleh dari cohort yang memenuhi kriteria dan sumber data yang diizinkan","predictor_measure":"Skala academic engagement","outcome_measure":"Status dropout dari catatan akademik","additional_variables":"IPK|Additional predictor|Continuous|;;Financial stress|Additional predictor|Continuous|"},{"id":"rct_prepost","label":"Eksperimen acak pre-post","question":"Apakah program mindfulness menurunkan anxiety dibandingkan kondisi kontrol setelah empat minggu?","objective":"Evaluate intervention","population":"Mahasiswa dengan anxiety ringan sampai sedang di Universitas X","hypothesis":"Penurunan anxiety pada kelompok mindfulness lebih besar daripada kelompok kontrol.","predictor":"Kondisi intervensi","predictor_scale":"Binary","groups":"2","outcome":"Anxiety","outcome_scale":"Continuous","outcome_categories":"","observations":"Repeated / paired","intervention":"Yes","randomized":"Yes","timepoints":"2","same_participants":"Yes","sampling_method":"Convenience sampling","target_population":"Mahasiswa dengan anxiety ringan sampai sedang di Universitas X","accessible_population":"Mahasiswa yang memenuhi kriteria dan bersedia mengikuti program empat minggu","inclusion_criteria":"Mahasiswa aktif, memenuhi kriteria awal, dan memberikan persetujuan","exclusion_criteria":"Kondisi yang memerlukan penanganan klinis segera atau tidak mengikuti pengukuran utama","recruitment_procedure":"Peserta direkrut melalui pengumuman, disaring sesuai kriteria, lalu ditempatkan secara acak ke kondisi","predictor_measure":"Kondisi intervensi berdasarkan catatan alokasi","outcome_measure":"Skala anxiety pada pretest dan posttest","additional_variables":"Skor anxiety baseline|Covariate|Continuous|"},{"id":"quasi_school","label":"Quasi-experiment dua sekolah","question":"Apakah perubahan well-being berbeda antara sekolah yang menggunakan program konseling baru dan sekolah yang menggunakan program biasa?","objective":"Evaluate intervention","population":"Siswa SMA pada dua sekolah yang berpartisipasi","hypothesis":"Peningkatan well-being lebih besar pada sekolah dengan program konseling baru.","predictor":"Program konseling","predictor_scale":"Binary","groups":"2","outcome":"Well-being","outcome_scale":"Continuous","outcome_categories":"","observations":"Repeated / paired","intervention":"Yes","randomized":"No","timepoints":"2","same_participants":"Yes","sampling_method":"Purposive sampling","target_population":"Siswa SMA yang relevan dengan konteks program","accessible_population":"Siswa pada dua sekolah yang menggunakan program berbeda","inclusion_criteria":"Siswa aktif yang mengikuti pengukuran awal dan bersedia ikut penelitian","exclusion_criteria":"Tidak memiliki data baseline atau outcome utama","recruitment_procedure":"Sekolah dipilih berdasarkan ketersediaan program; siswa yang memenuhi kriteria diundang","predictor_measure":"Jenis program konseling yang diterapkan sekolah","outcome_measure":"Skala well-being pada awal dan akhir periode","additional_variables":"Sekolah|Cluster variable|Categorical|2;;Well-being baseline|Covariate|Continuous|"},{"id":"long_mediation","label":"Longitudinal dengan mediator","question":"Apakah sleep quality menjadi mediator hubungan antara academic stress awal dan burnout pada akhir semester?","objective":"Explain mechanism","population":"Mahasiswa S1 di Universitas X","hypothesis":"Academic stress yang lebih tinggi memprediksi sleep quality yang lebih buruk, yang selanjutnya berkaitan dengan burnout yang lebih tinggi.","predictor":"Academic stress","predictor_scale":"Continuous","groups":"2","outcome":"Academic burnout","outcome_scale":"Continuous","outcome_categories":"","observations":"Repeated / paired","intervention":"No","randomized":"Not applicable","timepoints":"3","same_participants":"Yes","sampling_method":"Convenience sampling","target_population":"Mahasiswa S1 di Universitas X","accessible_population":"Mahasiswa yang dapat diikuti selama satu semester","inclusion_criteria":"Mahasiswa aktif yang bersedia mengikuti tiga kali pengukuran","exclusion_criteria":"Tidak memiliki outcome akhir atau identitas longitudinal tidak dapat dipasangkan","recruitment_procedure":"Peserta direkrut pada awal semester dan dihubungi kembali pada pengukuran berikutnya","predictor_measure":"Skala academic stress pada awal semester","outcome_measure":"Skala academic burnout pada akhir semester","additional_variables":"Sleep quality|Mediator|Continuous|"}],"challenges":[{"type":"Interpretasi","title":"Klaim Kausal","scenario":"Seorang peneliti melakukan survei satu kali pada 150 mahasiswa dan menemukan bahwa durasi tidur memprediksi IPK. Ia menyimpulkan bahwa menambah durasi tidur akan meningkatkan IPK.","question":"Apa masalah metodologis paling utama?","options":"Ukuran sampel terlalu kecil||Regresi tidak boleh digunakan||Kesimpulan kausal melebihi kemampuan desain||IPK harus dibuat kategorikal","answer":"C","explanation":"Data observasional cross-sectional dapat menunjukkan hubungan atau kemampuan prediksi, tetapi kesimpulan sebab-akibat membutuhkan desain dan asumsi yang lebih kuat.","reference":"STROBE; APA JARS-Quant","feedback_A":"Belum tentu. N = 150 bisa terlalu kecil atau cukup tergantung tujuan dan ketepatan yang dibutuhkan, tetapi masalah terbesar pada kasus ini adalah jenis kesimpulannya.","feedback_B":"Regresi boleh digunakan untuk menilai hubungan atau prediksi pada data seperti ini. Yang bermasalah adalah mengubah hasil regresi menjadi klaim bahwa mengubah tidur pasti menyebabkan IPK meningkat.","feedback_C":"Tepat. Survei satu kali tidak menetapkan urutan sebab-akibat dan masih memungkinkan banyak penjelasan lain. Kata “meningkatkan” adalah klaim kausal yang lebih kuat daripada yang didukung desain.","feedback_D":"Tidak. IPK dapat dianalisis sebagai variabel kontinu jika definisi dan distribusinya mendukung. Mengategorikan IPK justru dapat membuang informasi.","takeaway":"Bedakan kemampuan desain untuk menunjukkan hubungan/prediksi dari kemampuan untuk mendukung klaim sebab-akibat.","reference_urls":"https://www.strobe-statement.org/checklists/|https://www.apa.org/pubs/journals/resources/apa-style-jars"},{"type":"Pilih Analisis","title":"Tiga Kelompok","scenario":"Peneliti ingin membandingkan rata-rata academic burnout pada mahasiswa tahun pertama, kedua, dan ketiga. Outcome berupa skor kontinu dan ketiga kelompok independen.","question":"Analisis utama mana yang paling sesuai?","options":"Paired-samples t-test / uji t berpasangan||One-way ANOVA||Korelasi Pearson||Uji chi-square","answer":"B","explanation":"Outcome kontinu dibandingkan pada lebih dari dua kelompok yang independen. One-way ANOVA merupakan analisis utama yang sesuai; Welch ANOVA dapat dipertimbangkan jika varians antarkelompok berbeda.","reference":"APA JARS-Quant","feedback_A":"Paired t-test membutuhkan dua pengukuran yang berpasangan, misalnya orang yang sama diukur dua kali. Di sini tiga kelompok terdiri dari peserta berbeda.","feedback_B":"Tepat. Outcome kontinu dibandingkan pada tiga kelompok independen. One-way ANOVA adalah pilihan dasar yang sesuai; Welch ANOVA dapat dipertimbangkan jika varians berbeda.","feedback_C":"Korelasi Pearson digunakan terutama untuk hubungan antara dua variabel kuantitatif. Tahun studi pada kasus ini adalah kelompok kategorikal.","feedback_D":"Chi-square cocok untuk hubungan antarvariabel kategorikal berbasis frekuensi. Outcome pada kasus ini adalah skor kontinu.","takeaway":"Jenis outcome, jumlah kelompok, dan apakah kelompok independen/berpasangan menentukan keluarga analisis perbandingan.","reference_urls":"https://www.apa.org/pubs/journals/resources/apa-style-jars"},{"type":"Sampling","title":"Dari Satu Kelas ke Indonesia","scenario":"Peneliti merekrut semua partisipan dari dua kelas yang mudah dijangkau di satu universitas, lalu menyimpulkan bahwa hasilnya mewakili seluruh mahasiswa Indonesia.","question":"Apa isu utamanya?","options":"Convenience sampling membatasi generalisasi ke populasi||Convenience sampling selalu tidak valid||Penelitian harus memakai paired design||Jumlah variabel terlalu sedikit","answer":"A","explanation":"Convenience sampling dapat berguna, tetapi peluang setiap anggota populasi untuk terpilih tidak diketahui. Karena itu, generalisasi ke populasi yang jauh lebih luas perlu dilakukan dengan hati-hati.","reference":"STROBE; APA JARS-Quant","feedback_A":"Tepat. Sampel yang mudah dijangkau dapat berguna, tetapi tidak memberi dasar kuat untuk menganggap dua kelas mewakili seluruh mahasiswa Indonesia.","feedback_B":"Terlalu mutlak. Convenience sampling tidak otomatis membuat penelitian tidak berguna; kegunaannya bergantung pada tujuan dan batas generalisasi.","feedback_C":"Paired design berkaitan dengan data berpasangan atau pengukuran berulang, bukan dengan representativitas sampel.","feedback_D":"Jumlah variabel tidak menyelesaikan masalah siapa yang masuk sampel dan siapa yang tidak terwakili.","takeaway":"Cara memilih peserta menentukan batas generalisasi; sampel besar tidak otomatis representatif.","reference_urls":"https://www.strobe-statement.org/checklists/|https://www.apa.org/pubs/journals/resources/apa-style-jars"},{"type":"Measurement","title":"Alpha Tinggi","scenario":"Sebuah skala baru memiliki Cronbach's alpha = .94. Peneliti menyimpulkan bahwa skala tersebut sudah terbukti valid.","question":"Respons terbaik adalah...","options":"Alpha saja sudah cukup membuktikan validitas||Validitas tidak diperlukan jika reliabilitas tinggi||Diperlukan validitas bukti tambahan untuk intended interpretation dan use||Skala harus dipendekkan","answer":"C","explanation":"Reliabilitas dan validitas saling berkaitan tetapi menjawab pertanyaan yang berbeda. Konsistensi internal yang tinggi saja tidak membuktikan bahwa skor benar-benar mendukung interpretasi konstruk yang dimaksud.","reference":"AERA, APA, & NCME Standards","feedback_A":"Alpha tinggi menunjukkan konsistensi internal di bawah asumsi tertentu, bukan bukti lengkap bahwa skor mengukur konstruk yang dimaksud.","feedback_B":"Reliabilitas dan validitas menjawab pertanyaan berbeda. Skor yang konsisten tetap dapat mengukur hal yang keliru.","feedback_C":"Tepat. Peneliti perlu mengumpulkan atau merujuk bukti yang relevan untuk interpretasi dan penggunaan skor, tidak hanya satu koefisien reliabilitas.","feedback_D":"Memendekkan skala tidak mengikuti secara logis dari alpha = .94. Keputusan menghapus item perlu alasan substantif dan psikometris.","takeaway":"Reliabilitas adalah syarat penting, tetapi validitas membutuhkan bukti yang lebih luas dan sesuai tujuan penggunaan skor.","reference_urls":"https://www.testingstandards.net/"},{"type":"Sample Size","title":"Aturan 30","scenario":"Mahasiswa mengatakan, 'Penelitian kuantitatif cukup menggunakan 30 partisipan karena central limit theorem berlaku.'","question":"Koreksi paling kuat adalah...","options":"N = 30 adalah aturan universal||Ukuran sampel perlu dijustifikasi sesuai tujuan penelitian, desain, ukuran efek atau ketepatan estimasi, dan keterbatasan sumber daya||Central limit theorem membuat power selalu cukup||N = 30 hanya cukup untuk psikologi","answer":"B","explanation":"Penentuan ukuran sampel tidak dapat direduksi menjadi satu batas angka universal. N yang relevan bergantung pada apa yang ingin dipelajari dari data dan bagaimana analisis akan dilakukan.","reference":"Lakens (2022)","feedback_A":"Angka 30 bukan batas universal. Kebutuhan N berubah menurut tujuan, ukuran efek, ketepatan yang diinginkan, desain, dan analisis.","feedback_B":"Tepat. Justifikasi ukuran sampel harus mengikuti pertanyaan yang ingin dijawab dan asumsi yang digunakan, bukan satu aturan praktis.","feedback_C":"Central limit theorem tidak menjamin power memadai. Power tetap dipengaruhi N, ukuran efek, alpha, dan model analisis.","feedback_D":"Tidak ada aturan khusus bahwa N = 30 hanya atau selalu cukup untuk penelitian psikologi.","takeaway":"Ukuran sampel harus dijustifikasi berdasarkan tujuan dan asumsi penelitian, bukan angka minimum universal.","reference_urls":"https://doi.org/10.1525/collabra.33267"},{"type":"Pilih Desain","title":"Intervensi Tanpa Pengacakan","scenario":"Dua sekolah yang sudah ada menggunakan program konseling yang berbeda. Peneliti membandingkan outcome tetapi tidak dapat melakukan penempatan acak pada siswa atau sekolah.","question":"Deskripsi desain mana yang paling tepat dipertanggungjawabkan?","options":"Randomized controlled trial (RCT)||Quasi-experiment||Studi deskriptif cross-sectional saja||Meta-analisis","answer":"B","explanation":"Ada perbandingan intervensi atau kondisi, tetapi tidak ada penempatan acak. Ini merupakan ciri penting banyak desain quasi-experiment.","reference":"APA JARS-Quant","feedback_A":"RCT memerlukan penempatan acak yang sesuai. Pada kasus ini sekolah dan program sudah ada sehingga syarat itu tidak terpenuhi.","feedback_B":"Tepat. Ada intervensi/kondisi yang dibandingkan, tetapi tanpa penempatan acak; ini sesuai dengan keluarga quasi-experiment.","feedback_C":"Studi ini lebih dari sekadar deskriptif karena membandingkan outcome terkait dua program yang berbeda.","feedback_D":"Meta-analisis menggabungkan hasil dari banyak studi, bukan label untuk perbandingan dua sekolah dalam satu penelitian.","takeaway":"Ada intervensi tanpa penempatan acak → pikirkan quasi-experiment dan ancaman perbedaan awal antarkelompok.","reference_urls":"https://www.apa.org/pubs/journals/resources/apa-style-jars"},{"type":"Pilih Analisis","title":"Pre dan Post","scenario":"Empat puluh partisipan yang sama mengisi ukuran anxiety kontinu sebelum dan setelah program pelatihan singkat. Hanya ada satu kelompok.","question":"Perbandingan utama mana yang mempertahankan hubungan antara dua pengukuran dari peserta yang sama?","options":"Independent-samples t-test / uji t independen||Paired-samples t-test / uji t berpasangan||Chi-square||One-way ANOVA","answer":"B","explanation":"Setiap partisipan memberikan dua pengukuran yang saling berhubungan. Analisis perlu mempertahankan keterkaitan dua pengukuran dari orang yang sama.","reference":"General linear model framework","feedback_A":"Independent t-test menganggap dua kelompok tidak saling terkait. Di sini setiap orang menyumbang skor pre dan post sehingga data berpasangan.","feedback_B":"Tepat. Paired t-test mempertahankan pasangan skor dari orang yang sama ketika hanya ada dua waktu/kondisi dan tujuan utamanya membandingkan rata-rata perubahan.","feedback_C":"Chi-square digunakan untuk data kategorikal/frekuensi, bukan dua skor anxiety kontinu yang berpasangan.","feedback_D":"One-way ANOVA biasa mengabaikan pasangan skor. Untuk lebih dari dua waktu, repeated-measures atau mixed model lebih sesuai.","takeaway":"Jika orang yang sama diukur dua kali, analisis harus mempertahankan pasangan tersebut.","reference_urls":"https://www.apa.org/pubs/journals/resources/apa-style-jars"},{"type":"Interpretasi","title":"Tidak Signifikan","scenario":"Sebuah studi memperoleh perbedaan rata-rata 4 poin dengan interval kepercayaan 95% dari -1 sampai 9 dan p = .11. Penulis menyatakan, 'Tidak ada perbedaan antar kelompok.'","question":"Apa isu utamanya?","options":"p harus dibulatkan menjadi .10||Hasil yang tidak signifikan tidak membuktikan efek yang benar-benar nol; interval masih kompatibel dengan beberapa efek yang berbeda||Interval kepercayaan tidak boleh melewati nol||Sampel harus dihapus","answer":"B","explanation":"Hasil yang tidak signifikan bukan bukti bahwa efek sama dengan nol. Estimasi dan interval kepercayaan menunjukkan rentang efek yang masih sesuai dengan data dan model.","reference":"Wasserstein & Lazar (2016)","feedback_A":"Membulatkan p tidak menyelesaikan masalah interpretasi. Isunya adalah menyimpulkan “tidak ada perbedaan” hanya karena p > .05.","feedback_B":"Tepat. Interval -1 sampai 9 masih memuat efek negatif kecil, nol, dan efek positif yang cukup besar. Data belum mengidentifikasi satu nilai efek dengan pasti.","feedback_C":"Interval boleh melewati nol. Justru itu menunjukkan bahwa beberapa arah/nilai efek masih sesuai dengan data dan model.","feedback_D":"Tidak ada alasan menghapus sampel hanya karena hasil tidak signifikan.","takeaway":"p > .05 bukan bukti bahwa efek persis nol; baca estimasi dan interval ketidakpastiannya.","reference_urls":"https://doi.org/10.1080/00031305.2016.1154108"},{"type":"Desain","title":"Pengukuran Berulang","scenario":"Peneliti mengukur loneliness dan sleep quality setiap bulan selama satu tahun tanpa memanipulasi keduanya.","question":"Keluarga desain mana yang paling tepat?","options":"Cross-sectional experiment||Studi observasional longitudinal||Randomized trial||Case-control study secara otomatis","answer":"B","explanation":"Variabel diamati berulang dari waktu ke waktu tanpa intervensi. Karena itu, studi observasional longitudinal merupakan deskripsi desain yang paling sesuai.","reference":"STROBE; APA JARS-Quant","feedback_A":"Tidak ada manipulasi sehingga bukan eksperimen, dan data dikumpulkan berulang sehingga bukan cross-sectional satu kali.","feedback_B":"Tepat. Variabel diamati berulang selama satu tahun tanpa intervensi, sehingga desain observasional longitudinal paling sesuai.","feedback_C":"Randomized trial membutuhkan penempatan acak ke kondisi intervensi, yang tidak ada pada kasus ini.","feedback_D":"Case-control adalah desain dengan pemilihan peserta berdasarkan status outcome tertentu; pengukuran berulang tidak otomatis menjadikannya case-control.","takeaway":"Pengukuran berulang tanpa intervensi mengarah pada keluarga desain observasional longitudinal.","reference_urls":"https://www.strobe-statement.org/checklists/|https://www.apa.org/pubs/journals/resources/apa-style-jars"},{"type":"Perbaiki Studi","title":"Banyak t-test","scenario":"Peneliti membandingkan empat kelompok independen dengan enam uji t antar-pasangan kelompok tanpa penyesuaian dan hanya menyoroti perbandingan yang signifikan.","question":"Perbaikan metodologis terbaik adalah...","options":"Gunakan uji keseluruhan atau model yang sesuai, lalu rencanakan kontras/perbandingan dan penyesuaian untuk banyak pengujian||Pertahankan enam uji karena masing-masing valid||Ubah outcome menjadi biner||Naikkan alpha menjadi .10","answer":"A","explanation":"Gunakan model perbandingan kelompok yang sesuai, lalu rencanakan kontras atau penyesuaian untuk banyak pengujian. Cara ini lebih baik daripada menjalankan banyak uji t tanpa penyesuaian dan hanya menyoroti hasil yang signifikan.","reference":"APA JARS-Quant","feedback_A":"Tepat. Gunakan model keseluruhan yang sesuai, tentukan perbandingan yang memang ingin dijawab, dan kendalikan banyak pengujian bila diperlukan.","feedback_B":"Setiap t-test mungkin valid secara matematis, tetapi enam pengujian tanpa rencana/penyesuaian meningkatkan peluang hasil signifikan secara kebetulan dan selective reporting.","feedback_C":"Mengubah outcome kontinu menjadi biner membuang informasi dan tidak menyelesaikan masalah banyak pengujian.","feedback_D":"Menaikkan alpha justru meningkatkan peluang positif palsu dan bukan solusi untuk multiplicity.","takeaway":"Banyak pengujian perlu direncanakan dan dilaporkan secara transparan agar risiko hasil kebetulan tidak diabaikan.","reference_urls":"https://www.apa.org/pubs/journals/resources/apa-style-jars"},{"type":"Prediksi","title":"Kinerja Prediksi","scenario":"Model regresi memprediksi burnout dengan sangat baik pada 120 partisipan yang sama yang digunakan untuk membangun model. Penulis menyebutnya bukti kuat kemampuan prediksi pada data baru.","question":"Apa yang masih kurang?","options":"p-value yang lebih besar||Validasi pada data baru atau penilaian kinerja dengan resampling yang sesuai||Outcome kategorikal||Mediator kausal","answer":"B","explanation":"Klaim prediksi perlu dievaluasi pada data yang tidak hanya digunakan untuk membentuk model, atau dengan prosedur resampling yang sesuai untuk memperkirakan kinerja pada data baru.","reference":"Prediction-modeling principles","feedback_A":"p-value lebih besar tidak menilai kemampuan model bekerja pada data baru.","feedback_B":"Tepat. Kinerja pada data pembentukan model cenderung terlalu optimistis; gunakan data baru, holdout, cross-validation, atau resampling yang sesuai.","feedback_C":"Outcome tidak perlu dibuat kategorikal. Burnout kontinu dapat diprediksi dengan model yang sesuai.","feedback_D":"Mediator kausal tidak diperlukan untuk menilai kinerja prediksi.","takeaway":"Prediksi harus dinilai pada data yang tidak sekadar dipakai membangun model.","reference_urls":"https://doi.org/10.1097/01.psy.0000127692.23278.a9"},{"type":"Measurement","title":"Hanya Menerjemahkan","scenario":"Peneliti menerjemahkan skala psikologis berbahasa Inggris secara kata demi kata ke Bahasa Indonesia dan menganggap validitas bukti versi asli otomatis berlaku.","question":"Apa yang perlu dipertimbangkan?","options":"Tidak ada jika tata bahasa benar||adaptasi, kesetaraan makna, relevansi terhadap populasi, dan bukti baru untuk interpretasi skor||Hanya Cronbach's alpha||Hanya ukuran sampel","answer":"B","explanation":"Adaptasi tes lebih dari sekadar penerjemahan kata demi kata. Bahasa, budaya, makna konstruk, cara administrasi, dan bukti empiris pada konteks baru perlu dipertimbangkan.","reference":"ITC Guidelines for Translating and Adapting Tests","feedback_A":"Tata bahasa yang benar tidak menjamin makna item, konstruk, atau respons peserta tetap setara pada budaya yang berbeda.","feedback_B":"Tepat. Adaptasi perlu mempertimbangkan bahasa, budaya, kesetaraan makna, cara administrasi, serta bukti empiris pada populasi baru.","feedback_C":"Cronbach alpha hanya memberi informasi terbatas tentang konsistensi internal dan tidak cukup untuk menilai kesetaraan atau validitas adaptasi.","feedback_D":"Ukuran sampel penting untuk studi validasi, tetapi bukan satu-satunya isu ketika mengadaptasi instrumen.","takeaway":"Adaptasi instrumen adalah proses bahasa, budaya, dan psikometrik; bukan terjemahan literal saja.","reference_urls":"https://www.intestcom.org/files/guideline_test_adaptation_2ed.pdf"},{"type":"Pertanyaan Penelitian","title":"Pilih Uji Dulu?","scenario":"Mahasiswa mengatakan, 'Saya ingin memakai ANOVA. Pertanyaan penelitian apa yang harus saya tulis?'","question":"Urutan yang lebih baik adalah...","options":"Pilih uji dulu agar hasil terjamin||Tentukan pertanyaan substantif dan variabel lebih dulu, lalu pilih analisis yang menjawabnya||Gunakan pertanyaan yang menghasilkan p-value terendah||Tidak perlu pertanyaan penelitian","answer":"B","explanation":"Analisis statistik seharusnya mengikuti pertanyaan penelitian, tujuan, desain, dan struktur variabel. Jangan menentukan pertanyaan penelitian setelah memilih uji yang ingin digunakan.","reference":"APA JARS-Quant","feedback_A":"Memilih uji dulu membuat pertanyaan penelitian berisiko disesuaikan dengan teknik yang familiar, bukan kebutuhan substantif.","feedback_B":"Tepat. Mulai dari pertanyaan, tujuan, variabel, dan desain; analisis dipilih untuk menjawab struktur tersebut.","feedback_C":"Mengejar p-value terendah meningkatkan risiko keputusan analisis yang bias dan tidak transparan.","feedback_D":"Pertanyaan penelitian memberi arah pada desain, data yang dikumpulkan, dan interpretasi; menghilangkannya membuat perencanaan tidak jelas.","takeaway":"Pertanyaan penelitian datang lebih dulu; uji statistik dipilih untuk menjawabnya.","reference_urls":"https://www.apa.org/pubs/journals/resources/apa-style-jars"},{"type":"Desain","title":"Penempatan Acak","scenario":"Partisipan yang memenuhi kriteria dialokasikan secara acak ke intervensi dan kondisi kontrol sebelum outcome diukur.","question":"Fitur desain mana yang paling langsung memperkuat kesetaraan kondisi awal secara probabilistik?","options":"Alpha besar||Penempatan acak||Preuji yang signifikan||Hanya memakai relawan","answer":"B","explanation":"Penempatan acak membantu membuat kondisi awal antarkelompok lebih sebanding secara probabilistik. Namun masalah pelaksanaan, kehilangan peserta, dan pengukuran tetap perlu diperhatikan.","reference":"CONSORT 2025","feedback_A":"Alpha besar tidak berkaitan dengan pembentukan kesetaraan awal antarkondisi.","feedback_B":"Tepat. Penempatan acak membuat perbedaan awal antarkelompok terjadi secara probabilistik dan memperkuat dasar perbandingan kausal.","feedback_C":"Pretest tidak harus signifikan atau nonsignifikan untuk membuktikan randomisasi berhasil; randomisasi adalah prosedur desain.","feedback_D":"Menggunakan relawan berkaitan dengan rekrutmen/generalisasi, bukan kesetaraan kondisi yang dibentuk melalui random assignment.","takeaway":"Random assignment adalah prosedur desain yang memperkuat perbandingan kondisi, bukan sama dengan random sampling.","reference_urls":"https://www.consort-spirit.org/published-statements"},{"type":"Sample Size","title":"Tujuan Ketepatan Estimasi","scenario":"Peneliti terutama ingin mengestimasi prevalensi dengan interval kepercayaan yang sempit, bukan menguji apakah prevalensi berbeda dari nol.","question":"Dasar perencanaan mana yang paling sesuai?","options":"Perencanaan berdasarkan ketepatan estimasi / margin of error||Hanya post-hoc power||Selalu N = 100||Tentukan N dari jumlah item kuesioner","answer":"A","explanation":"Jika tujuan utamanya mengestimasi suatu nilai, tingkat ketepatan atau margin of error sering menjadi dasar penentuan ukuran sampel yang lebih langsung daripada power untuk menguji hipotesis nol.","reference":"Lakens (2022)","feedback_A":"Tepat. Jika fokusnya ketepatan prevalensi, rencanakan N berdasarkan lebar interval atau margin of error yang dianggap berguna.","feedback_B":"Post-hoc power tidak menjawab ketepatan estimasi dan umumnya tidak membantu menafsirkan hasil studi yang sudah selesai.","feedback_C":"N = 100 tidak memiliki dasar universal untuk target ketepatan prevalensi.","feedback_D":"Jumlah item kuesioner tidak menentukan secara langsung jumlah peserta yang dibutuhkan untuk mengestimasi prevalensi.","takeaway":"Jika tujuan utama adalah estimasi, ketepatan estimasi dapat menjadi dasar ukuran sampel yang lebih langsung daripada uji null.","reference_urls":"https://doi.org/10.1525/collabra.33267"},{"type":"Measurement","title":"Kesesuaian Populasi","scenario":"Depression scale memiliki bukti kuat pada orang dewasa lanjut usia di Amerika Serikat, tetapi studi baru akan menggunakan remaja Indonesia.","question":"Sikap metodologis terbaik adalah...","options":"Bukti lama otomatis berlaku||Relevansi populasi dan konteks budaya perlu diperiksa||Reliabilitas tidak relevan||Gunakan tanpa dokumentasi","answer":"B","explanation":"Bukti pengukuran selalu terkait dengan interpretasi, populasi, bahasa, dan tujuan penggunaan tertentu. Bukti dari kelompok usia atau budaya lain tidak otomatis berlaku tanpa pemeriksaan tambahan.","reference":"AERA, APA, & NCME Standards; ITC Guidelines","feedback_A":"Bukti pengukuran selalu terkait dengan populasi dan tujuan penggunaan. Perbedaan usia, bahasa, dan budaya dapat mengubah cara skor berfungsi.","feedback_B":"Tepat. Periksa apakah konstruk, bahasa, struktur skor, reliabilitas, dan bukti validitas relevan untuk remaja Indonesia.","feedback_C":"Reliabilitas tetap relevan karena interpretasi skor membutuhkan tingkat ketepatan yang memadai.","feedback_D":"Penggunaan tanpa dokumentasi membuat pembaca tidak dapat menilai kecocokan instrumen dengan konteks penelitian.","takeaway":"Bukti pengukuran perlu relevan dengan populasi, bahasa, konteks, dan tujuan penggunaan.","reference_urls":"https://www.testingstandards.net/|https://www.intestcom.org/files/guideline_test_adaptation_2ed.pdf"},{"type":"Analisis","title":"Outcome Biner","scenario":"Peneliti memprediksi apakah mahasiswa drop out (ya/tidak) menggunakan beberapa prediktor kontinu dan kategorikal.","question":"Keluarga model utama mana yang sesuai dengan outcome?","options":"Ordinary one-way ANOVA||Regresi logistik biner||Korelasi Pearson saja||Uji t berpasangan","answer":"B","explanation":"Outcome biner dimodelkan sebagai peluang terjadinya suatu kejadian. Jika terdapat beberapa prediktor, regresi logistik merupakan salah satu model utama yang umum digunakan.","reference":"Generalized linear model framework","feedback_A":"ANOVA biasa ditujukan untuk outcome kontinu, sedangkan status dropout hanya memiliki dua kategori.","feedback_B":"Tepat. Regresi logistik biner memodelkan peluang outcome ya/tidak dan dapat memasukkan beberapa prediktor.","feedback_C":"Korelasi Pearson saja tidak sesuai untuk outcome biner dan juga tidak memadai untuk beberapa prediktor.","feedback_D":"Paired t-test digunakan untuk dua pengukuran kontinu yang berpasangan, bukan outcome dropout biner.","takeaway":"Outcome biner membutuhkan model yang menghormati bentuk peluang/probabilitas, seperti regresi logistik.","reference_urls":"https://www.apa.org/pubs/journals/resources/apa-style-jars"},{"type":"Interpretasi","title":"Makna Praktis","scenario":"Studi sangat besar menemukan perbedaan rata-rata 0.08 poin pada skala 100 poin dengan p < .001.","question":"Apa yang sebaiknya dilakukan peneliti?","options":"Sebut efek penting karena p kecil||Pertimbangkan estimasi efek, interval kepercayaan, dan makna substantif||Sembunyikan ukuran efek||Naikkan alpha","answer":"B","explanation":"Signifikansi statistik dan makna substantif adalah dua hal berbeda. Sampel besar dapat menghasilkan p-value kecil untuk efek yang sangat kecil secara praktis.","reference":"ASA Statement on p-Values","feedback_A":"p kecil menunjukkan data tidak terlalu sesuai dengan null model tertentu, tetapi tidak mengatakan bahwa perbedaan 0.08 poin penting secara praktis.","feedback_B":"Tepat. Nilai estimasi, interval kepercayaan, ukuran efek, dan konteks substantif diperlukan untuk menilai makna hasil.","feedback_C":"Menyembunyikan ukuran efek justru mengurangi transparansi dan mempersulit penilaian makna praktis.","feedback_D":"Mengubah alpha tidak mengubah besar efek yang diamati dan bukan cara menentukan kepentingan substantif.","takeaway":"Signifikansi statistik tidak sama dengan penting secara praktis.","reference_urls":"https://doi.org/10.1080/00031305.2016.1154108"},{"type":"Coherence","title":"Analisis Utama Berubah","scenario":"Mahasiswa menghitung power untuk uji t dua kelompok, lalu mengubah desain menjadi empat kelompok independen dengan ANOVA sebagai analisis utama.","question":"Apa yang harus dilakukan terhadap rencana ukuran sampel?","options":"Tidak perlu berubah; N lama permanen valid||Ulangi justifikasi ukuran sampel karena analisis utama dan desain berubah||Bagi N lama dengan empat||Otomatis gunakan N = 30 per kelompok","answer":"B","explanation":"Justifikasi ukuran sampel bergantung pada analisis utama, ukuran efek yang dianggap penting, pembagian peserta, dan tujuan penelitian. Jika desain berubah, perhitungan awal dapat menjadi tidak sesuai.","reference":"Lakens (2022)","feedback_A":"Perhitungan lama dibuat untuk struktur dua kelompok dan tidak otomatis berlaku ketika analisis utama berubah menjadi ANOVA empat kelompok.","feedback_B":"Tepat. Ulangi justifikasi N menggunakan tujuan, model, jumlah kelompok, ukuran efek/ketepatan, dan asumsi yang sesuai dengan desain baru.","feedback_C":"Membagi N lama dengan empat tidak memiliki dasar karena kebutuhan N bukan sekadar pembagian aritmetis dari desain sebelumnya.","feedback_D":"N = 30 per kelompok tetap hanya aturan praktis dan tidak menggantikan justifikasi ukuran sampel.","takeaway":"Jika desain atau analisis utama berubah, justifikasi ukuran sampel perlu diperiksa kembali.","reference_urls":"https://doi.org/10.1525/collabra.33267"},{"type":"Interpretasi","title":"Korelasi dan Sebab-Akibat","scenario":"Pada studi cross-sectional, self-esteem dan well-being berkorelasi r = .45. Penulis menyatakan self-esteem meningkatkan well-being.","question":"Pernyataan yang lebih tepat adalah...","options":"Self-esteem menyebabkan well-being||Terdapat hubungan positif antara self-esteem dan well-being dalam data ini||r = .45 membuktikan mediasi||Korelasi tidak boleh dilaporkan","answer":"B","explanation":"Korelasi pada data observasional cross-sectional mendukung pernyataan tentang hubungan, tetapi tidak otomatis menunjukkan arah sebab-akibat.","reference":"STROBE; APA JARS-Quant","feedback_A":"Korelasi tidak menentukan arah sebab-akibat. Self-esteem dapat memengaruhi well-being, sebaliknya, keduanya dipengaruhi faktor lain, atau kombinasi proses.","feedback_B":"Tepat. Pernyataan ini sesuai dengan informasi yang benar-benar ditunjukkan oleh korelasi cross-sectional: ada hubungan positif dalam data.","feedback_C":"Nilai r = .45 hanya menggambarkan hubungan bivariat dan tidak membuktikan jalur mediasi.","feedback_D":"Korelasi boleh dilaporkan jika sesuai dengan pertanyaan dan data; yang perlu dibatasi adalah interpretasi kausalnya.","takeaway":"Korelasi menunjukkan hubungan; arah sebab-akibat membutuhkan informasi desain dan asumsi tambahan.","reference_urls":"https://www.strobe-statement.org/checklists/|https://www.apa.org/pubs/journals/resources/apa-style-jars"}],"references":[{"title":"APA JARS–Quant","citation":"Appelbaum, M., Cooper, H., Kline, R. B., Mayo-Wilson, E., Nezu, A. M., & Rao, S. M. (2018). Journal article reporting standards for quantitative research in psychology: The APA Publications and Communications Board task force report. American Psychologist, 73(1), 3–25. https://doi.org/10.1037/amp0000191","source_type":"Standar pelaporan / laporan gugus tugas yang ditelaah sejawat","topics":"Pelaporan; desain; analisis; transparansi","use_in_app":"Menjadi dasar untuk mengingatkan agar pertanyaan penelitian, penentuan ukuran sampel, desain, pengukuran, analisis, dan interpretasi dijelaskan secara transparan.","scope_limit":"JARS adalah standar pelaporan, bukan buku resep yang menentukan satu uji statistik untuk semua situasi. Rekomendasi di app tetap harus disesuaikan dengan desain penelitian dan bidang yang diteliti.","url":"https://www.apa.org/pubs/journals/resources/apa-style-jars"},{"title":"STROBE Statement","citation":"von Elm, E., Altman, D. G., Egger, M., Pocock, S. J., Gøtzsche, P. C., & Vandenbroucke, J. P. (2007). The Strengthening the Reporting of Observational Studies in Epidemiology (STROBE) statement. PLoS Medicine, 4(10), e296. https://doi.org/10.1371/journal.pmed.0040296","source_type":"Pedoman pelaporan","topics":"Studi observasional; partisipan; variabel; bias; ukuran studi; analisis","use_in_app":"Digunakan untuk mengingatkan agar peneliti menjelaskan cara memilih peserta, definisi outcome dan paparan/prediktor, variabel perancu atau moderator yang relevan, potensi bias, ukuran studi, data hilang, dan metode sampling pada studi observasional.","scope_limit":"STROBE membantu membuat pelaporan lebih lengkap. Mengikuti checklist STROBE tidak otomatis membuat desain bebas bias atau membuktikan hubungan sebab-akibat.","url":"https://www.strobe-statement.org/checklists/"},{"title":"CONSORT 2025","citation":"Hopewell, S., Chan, A.-W., Collins, G. S., Hróbjartsson, A., Moher, D., Schulz, K. F., et al. (2025). CONSORT 2025 statement: updated guideline for reporting randomised trials. BMJ, 389, e081123. https://doi.org/10.1136/bmj-2024-081123","source_type":"Pedoman pelaporan","topics":"Uji acak; alokasi; intervensi; outcome; analisis","use_in_app":"Digunakan ketika Alur Penelitian mengarah pada eksperimen acak. App memakai CONSORT untuk menekankan kejelasan cara peserta dialokasikan, alur peserta, outcome, analisis, efek yang tidak diinginkan, dan interpretasi.","scope_limit":"CONSORT berfokus pada pelaporan randomized trial. Jenis trial tertentu dapat membutuhkan extension CONSORT atau pedoman metode tambahan.","url":"https://www.consort-spirit.org/published-statements"},{"title":"Standards for Educational and Psychological Testing","citation":"American Educational Research Association, American Psychological Association, & National Council on Measurement in Education. (2014). Standards for Educational and Psychological Testing. AERA.","source_type":"Standar profesional pengujian","topics":"Pengukuran; validitas; reliabilitas; ketepatan; fairness; penggunaan tes","use_in_app":"Menjadi dasar Measurement Lab untuk membedakan bukti validitas, reliabilitas atau ketepatan skor, fairness, tujuan interpretasi skor, dan penggunaan skor yang bertanggung jawab.","scope_limit":"Standards memberikan prinsip umum tentang tes dan interpretasi skor. Bukti yang diperlukan tetap bergantung pada tujuan penggunaan, populasi, dan konsekuensi dari penggunaan skor.","url":"https://www.testingstandards.net/"},{"title":"ITC Guidelines for Translating and Adapting Tests, Second Edition","citation":"International Test Commission. (2018). ITC Guidelines for Translating and Adapting Tests (Second Edition). International Journal of Testing, 18(2), 101–134. https://doi.org/10.1080/15305058.2017.1398166","source_type":"Pedoman internasional","topics":"Adaptasi tes; pengukuran lintas budaya; kesetaraan","use_in_app":"Digunakan untuk menjelaskan bahwa adaptasi tes mencakup bahasa dan budaya, pemeriksaan empiris, cara administrasi, penskoran, interpretasi, dan dokumentasi; bukan sekadar menerjemahkan kata demi kata.","scope_limit":"Pedoman ini khusus untuk penerjemahan dan adaptasi tes. Pedoman ini tidak menggantikan pengujian validitas yang sesuai dengan konstruk, populasi, maupun aturan etik dan hukum setempat.","url":"https://www.intestcom.org/files/guideline_test_adaptation_2ed.pdf"},{"title":"Sample Size Justification","citation":"Lakens, D. (2022). Sample Size Justification. Collabra: Psychology, 8(1), 33267. https://doi.org/10.1525/collabra.33267","source_type":"Tinjauan metode yang ditelaah sejawat","topics":"Ukuran sampel; power; ketepatan estimasi; keterbatasan sumber daya; populasi terbatas","use_in_app":"Menjadi sumber utama untuk menjelaskan berbagai cara menjustifikasi ukuran sampel: power sebelum penelitian, ketepatan estimasi, keterbatasan sumber daya, atau mengukur hampir seluruh populasi. Sumber ini juga digunakan untuk menolak gagasan bahwa ada satu minimum N yang berlaku universal.","scope_limit":"Artikel ini memberi kerangka berpikir, bukan satu rumus universal. Perhitungan tetap harus mengikuti analisis yang direncanakan, besaran yang ingin diestimasi, desain, hubungan antarobservasi, dan asumsi model.","url":"https://doi.org/10.1525/collabra.33267"},{"title":"NIST/SEMATECH e-Handbook: Sample sizes required","citation":"NIST/SEMATECH. e-Handbook of Statistical Methods, Section 7.2.7.2: Sample sizes required.","source_type":"Handbook statistik resmi","topics":"Ukuran sampel; proporsi; margin of error; koreksi populasi terbatas","use_in_app":"Digunakan untuk perencanaan ukuran sampel berdasarkan ketepatan estimasi proporsi dan untuk menjelaskan koreksi populasi terbatas (finite population correction/FPC) ketika sampel diambil tanpa mengembalikan anggota yang sudah terpilih ke populasi.","scope_limit":"Rumus pendekatan normal untuk proporsi memiliki asumsi tertentu dan dapat kurang tepat bila proporsi sangat kecil/besar atau sampel kecil. Sampling yang kompleks memerlukan penyesuaian tambahan.","url":"https://www.itl.nist.gov/div898/handbook/prc/section2/old.prc272.htm"},{"title":"UN Handbook of Surveys on Households and Individuals","citation":"United Nations Statistics Division. (2026). Handbook of Surveys on Households and Individuals: Foundations and Emerging Approaches (Final Draft, updated April 30, 2026). Chapter 5: Sample design, including design effect, nonresponse adjustment, and finite population correction.","source_type":"Handbook survei internasional resmi","topics":"Sampling survei; koreksi populasi terbatas; efek desain; respons","use_in_app":"Digunakan untuk menjelaskan kapan jumlah populasi memengaruhi kebutuhan sampel, kapan koreksi populasi terbatas (FPC) relevan, serta bagaimana efek desain dan tingkat respons dapat mengubah jumlah peserta yang perlu direkrut.","scope_limit":"Panduan FPC dan efek desain terutama berlaku pada survei dengan sampling probabilitas. Prinsip ini tidak boleh dipakai untuk memberi kesan bahwa convenience atau purposive sample otomatis representatif.","url":"https://unstats.un.org/UNSDWebsite/statcom/session_57/documents/BG-3k-Handbook_on_Surveys_of_Household_and_Individuals-E.pdf"},{"title":"ASA Statement on p-Values","citation":"Wasserstein, R. L., & Lazar, N. A. (2016). The ASA Statement on p-Values: Context, Process, and Purpose. The American Statistician, 70(2), 129–133. https://doi.org/10.1080/00031305.2016.1154108","source_type":"Pernyataan resmi asosiasi statistik","topics":"p-value; inferensi; interpretasi","use_in_app":"Digunakan pada Analysis Lab dan Miskonsepsi Umum untuk menjelaskan bahwa p-value bukan ukuran besar-kecilnya efek, bukan peluang bahwa hipotesis benar, dan bukan ukuran penting-tidaknya hasil secara praktis.","scope_limit":"Pernyataan ASA tidak melarang penggunaan p-value. Pesan utamanya adalah agar p-value tidak dibaca secara berlebihan atau dijadikan satu-satunya dasar keputusan melalui batas angka yang kaku.","url":"https://doi.org/10.1080/00031305.2016.1154108"},{"title":"Moving to a World Beyond p < .05","citation":"Wasserstein, R. L., Schirm, A. L., & Lazar, N. A. (2019). Moving to a World Beyond ‘p < 0.05’. The American Statistician, 73(sup1), 1–19. https://doi.org/10.1080/00031305.2019.1583913","source_type":"Sintesis editorial yang ditelaah sejawat","topics":"Signifikansi statistik; ketidakpastian; bukti; pengambilan keputusan","use_in_app":"Digunakan untuk menjelaskan bahwa pembagian hasil menjadi sekadar signifikan atau tidak signifikan sebaiknya dilengkapi dengan estimasi efek, ketidakpastian, kualitas studi, dan konteks ilmiah.","scope_limit":"Artikel ini tidak mewajibkan satu kerangka inferensi tertentu. Fokusnya adalah mendorong praktik yang lebih informatif daripada hanya memakai batas p < .05.","url":"https://doi.org/10.1080/00031305.2019.1583913"},{"title":"Statistical tests, P values, confidence intervals, and power: a guide to misinterpretations","citation":"Greenland, S., Senn, S. J., Rothman, K. J., Carlin, J. B., Poole, C., Goodman, S. N., & Altman, D. G. (2016). European Journal of Epidemiology, 31, 337–350. https://doi.org/10.1007/s10654-016-0149-3","source_type":"Tutorial metode yang ditelaah sejawat","topics":"p-value; confidence interval; power; salah interpretasi umum","use_in_app":"Digunakan untuk Miskonsepsi Umum tentang p-value, confidence interval, signifikansi statistik, dan power, terutama untuk menjelaskan apa yang tidak dapat disimpulkan dari angka-angka tersebut.","scope_limit":"Artikel berfokus pada kuantitas frequentist dan salah interpretasinya. Cara menarik kesimpulan tetap harus disesuaikan dengan desain, model, dan tujuan ilmiah.","url":"https://doi.org/10.1007/s10654-016-0149-3"},{"title":"Causal Inference: What If","citation":"Hernán, M. A., & Robins, J. M. (2020). Causal Inference: What If. Chapman & Hall/CRC.","source_type":"Buku teks terbuka / referensi metode","topics":"Inferensi kausal; variabel perancu; seleksi; efek kausal","use_in_app":"Digunakan pada tingkat Advanced untuk menjelaskan variabel perancu, kontrol yang tidak tepat, bias akibat seleksi/collider, urutan waktu, dan perbedaan antara hubungan statistik dengan efek sebab-akibat.","scope_limit":"Kesimpulan sebab-akibat membutuhkan asumsi substantif dan alasan desain yang kuat. App tidak menggantikan causal diagram atau rencana analisis kausal yang lengkap.","url":"https://www.hsph.harvard.edu/miguel-hernan/causal-inference-book/"},{"title":"Coefficient alpha and internal consistency","citation":"Sijtsma, K. (2009). On the use, the misuse, and the very limited usefulness of Cronbach’s alpha. Psychometrika, 74, 107–120. https://doi.org/10.1007/s11336-008-9101-0","source_type":"Artikel metode psikometri yang ditelaah sejawat","topics":"Reliabilitas; konsistensi internal; Cronbach alpha","use_in_app":"Digunakan pada Measurement Lab dan Miskonsepsi Umum untuk menjelaskan bahwa Cronbach alpha bukan ukuran validitas dan tidak otomatis membuktikan bahwa skala hanya memiliki satu dimensi atau bahwa kualitas skornya sudah memadai.","scope_limit":"Kritik terhadap alpha tidak berarti alpha selalu dilarang. Koefisien reliabilitas yang dipilih sebaiknya sesuai dengan model pengukuran, penggunaan skor, dan asumsi yang masuk akal.","url":"https://doi.org/10.1007/s11336-008-9101-0"},{"title":"The cost of dichotomising continuous variables","citation":"Altman, D. G., & Royston, P. (2006). The cost of dichotomising continuous variables. BMJ, 332, 1080. https://doi.org/10.1136/bmj.332.7549.1080","source_type":"Catatan statistik yang ditelaah sejawat","topics":"Variabel kontinu; dikotomisasi; power; pemodelan","use_in_app":"Digunakan pada miskonsepsi tentang median split dan pengelompokan variabel kontinu secara sembarangan. Sumber ini menjelaskan bahwa kategorisasi dapat membuang informasi, menurunkan power, dan menciptakan batas kategori yang artifisial.","scope_limit":"Bukan berarti kategorisasi selalu salah. Cutoff dapat masuk akal bila mempunyai dasar klinis, kebijakan, atau keputusan yang jelas; hal itu berbeda dari mengategorikan data hanya agar analisis terasa lebih mudah.","url":"https://doi.org/10.1136/bmj.332.7549.1080"},{"title":"False-positive psychology","citation":"Simmons, J. P., Nelson, L. D., & Simonsohn, U. (2011). False-positive psychology: Undisclosed flexibility in data collection and analysis allows presenting anything as significant. Psychological Science, 22(11), 1359–1366. https://doi.org/10.1177/0956797611417632","source_type":"Artikel metode yang ditelaah sejawat","topics":"Fleksibilitas analisis; banyak pengujian; optional stopping; pelaporan selektif","use_in_app":"Digunakan pada miskonsepsi tentang banyak pengujian, menambah sampel setelah melihat hasil, memilih hanya analisis yang signifikan, aturan eksklusi yang berubah, dan keputusan analisis yang dipengaruhi hasil.","scope_limit":"Artikel ini menunjukkan risiko fleksibilitas analisis yang tidak transparan. Analisis eksploratif tetap berguna selama diberi label dengan jelas dan seluruh keputusan penting dilaporkan secara transparan.","url":"https://doi.org/10.1177/0956797611417632"},{"title":"What you see may not be what you get: overfitting in regression-type models","citation":"Babyak, M. A. (2004). What you see may not be what you get: A brief, nontechnical introduction to overfitting in regression-type models. Psychosomatic Medicine, 66(3), 411–421. https://doi.org/10.1097/01.psy.0000127692.23278.a9","source_type":"Tutorial metode yang ditelaah sejawat","topics":"Regresi; overfitting; pemilihan model; validasi","use_in_app":"Digunakan untuk menjelaskan bahwa R² tinggi, banyak prediktor, atau koefisien signifikan tidak otomatis menghasilkan model yang stabil atau mampu memprediksi data baru dengan baik.","scope_limit":"Artikel ini bersifat pengantar. Untuk model prediksi tertentu, pengguna tetap perlu mengikuti pedoman validasi yang lebih spesifik dan mutakhir.","url":"https://doi.org/10.1097/01.psy.0000127692.23278.a9"},{"title":"Bias in cross-sectional analyses of longitudinal mediation","citation":"Maxwell, S. E., & Cole, D. A. (2007). Bias in cross-sectional analyses of longitudinal mediation. Psychological Methods, 12(1), 23–44. https://doi.org/10.1037/1082-989X.12.1.23","source_type":"Artikel metode yang ditelaah sejawat","topics":"Mediasi; longitudinal; urutan waktu","use_in_app":"Digunakan untuk mengingatkan bahwa analisis mediasi cross-sectional dapat menggambarkan proses longitudinal secara keliru dan tidak otomatis membuktikan mekanisme sebab-akibat.","scope_limit":"Bukan berarti semua analisis indirect effect cross-sectional tidak berguna. Interpretasinya perlu dibatasi pada pola statistik dan dukungan teori, bukan dianggap sebagai mekanisme kausal yang sudah terbukti.","url":"https://doi.org/10.1037/1082-989X.12.1.23"},{"title":"Multiple imputation using chained equations: Issues and guidance for practice","citation":"White, I. R., Royston, P., & Wood, A. M. (2011). Multiple imputation using chained equations: Issues and guidance for practice. Statistics in Medicine, 30(4), 377–399. https://doi.org/10.1002/sim.4067","source_type":"Pedoman metode yang ditelaah sejawat","topics":"Data hilang; multiple imputation; chained equations","use_in_app":"Digunakan pada miskonsepsi bahwa sedikit data hilang selalu boleh diabaikan atau bahwa mengganti nilai hilang dengan mean merupakan solusi yang aman.","scope_limit":"Multiple imputation bukan solusi otomatis untuk semua masalah data hilang. Ketepatan hasil tetap bergantung pada model imputasi, asumsi tentang penyebab data hilang, kesesuaian dengan analisis utama, dan pemeriksaan model.","url":"https://doi.org/10.1002/sim.4067"}],"misconceptions":[{"category":"Sampling & Sample Size","myth":"N = 30 selalu cukup untuk penelitian kuantitatif.","short_correction":"Tidak ada satu minimum N yang berlaku untuk semua penelitian.","why_it_seems_true":"Angka 30 mudah diingat dan sering dikaitkan secara terlalu sederhana dengan central limit theorem (teorema limit pusat) atau aturan praktis dari buku pengantar. Karena itu angka ini kadang diperlakukan seolah-olah menjadi batas yang berlaku untuk semua antara sampel “kecil” dan “cukup”.","explanation":"Ukuran sampel ditentukan oleh apa yang ingin dipelajari dari data. Penelitian yang ingin mendeteksi efek kecil membutuhkan jumlah peserta yang berbeda dari penelitian yang ingin mengestimasi rata-rata dengan batas kesalahan (margin of error) tertentu. Model statistik, kualitas pengukuran, pengelompokan data, jumlah parameter, perkiraan data yang hilang, dan tingkat ketepatan yang diinginkan juga dapat berpengaruh. Karena itu, dua penelitian yang memakai uji statistik yang sama belum tentu membutuhkan N yang sama. N = 30 bisa terlalu kecil untuk satu tujuan, tetapi mungkin cukup untuk tujuan lain yang sangat terbatas. Ukuran sampel sebaiknya menjadi bagian dari perencanaan penelitian, bukan sekadar mengikuti angka minimum yang diwariskan sebagai aturan praktis.","example":"Jika targetnya mendeteksi korelasi sekitar r = .10 dengan power yang memadai, N = 30 memiliki kemampuan deteksi yang rendah. Sebaliknya, untuk tujuan deskriptif yang sangat terbatas, N = 30 mungkin tetap dapat memberikan informasi yang berguna.","better_practice":"Tentukan dahulu tujuan analisis. Setelah itu, justifikasi N dengan metode yang sesuai, misalnya analisis power, target batas kesalahan/ketepatan estimasi, keterbatasan sumber daya yang disertai analisis sensitivitas, atau alasan lain yang sesuai dengan desain. Jelaskan asumsi dan sumber ukuran efek atau target ketepatan yang digunakan.","reference":"Lakens (2022)","reference_urls":"https://doi.org/10.1525/collabra.33267"},{"category":"Sampling & Sample Size","myth":"Ukuran sampel selalu ditentukan dari jumlah populasi.","short_correction":"Jumlah populasi hanya menjadi faktor utama pada kondisi tertentu.","why_it_seems_true":"Banyak tabel atau kalkulator populer meminta “jumlah populasi” sebagai input utama sehingga mudah muncul kesan bahwa ukuran sampel pada semua studi merupakan persentase tertentu dari populasi.","explanation":"Pada banyak penelitian, terutama ketika ukuran sampel ditentukan dengan analisis power untuk mendeteksi suatu efek, jumlah peserta lebih dipengaruhi oleh ukuran efek yang dianggap penting, alpha, target power, desain, dan model statistik daripada oleh jumlah populasi. Jumlah populasi menjadi lebih penting ketika peneliti menggunakan sampling probabilitas dari populasi yang jelas dan terbatas, lalu sampel mengambil bagian yang cukup besar dari populasi tersebut. Dalam kondisi itu, koreksi populasi terbatas (finite population correction/FPC) dapat digunakan. Namun memasukkan jumlah populasi ke sebuah rumus tidak memperbaiki bias seleksi pada convenience atau purposive sampling. Jadi pertanyaan yang lebih tepat adalah: kesimpulan apa yang ingin dibuat, bagaimana sampel dipilih, dan seberapa besar bagian populasi yang diambil sebagai sampel?","example":"Mengambil 400 orang secara acak dari populasi 700 berbeda dari mengambil 400 orang dari populasi 700.000 karena pada kasus pertama hampir seluruh populasi sudah tercakup. Namun 400 responden convenience dari populasi 700 tetap tidak otomatis representatif.","better_practice":"Gunakan jumlah populasi dalam perhitungan jika memang relevan dengan desain sampling, misalnya sampling probabilitas dari populasi yang jelas dan terbatas. Untuk sampling nonprobabilitas, jelaskan alasan pemilihan sampel dan batas generalisasi hasil.","reference":"Lakens (2022); NIST/SEMATECH; United Nations Statistics Division (2026)","reference_urls":"https://doi.org/10.1525/collabra.33267|https://www.itl.nist.gov/div898/handbook/prc/section2/old.prc272.htm|https://unstats.un.org/UNSDWebsite/statcom/session_57/documents/BG-3k-Handbook_on_Surveys_of_Household_and_Individuals-E.pdf"},{"category":"Sampling & Sample Size","myth":"Sampel besar otomatis representatif.","short_correction":"Sampel besar mengurangi galat acak, tetapi tidak otomatis menghilangkan bias seleksi.","why_it_seems_true":"Jumlah responden yang besar terasa meyakinkan dan membuat galat baku lebih kecil, sehingga mudah disamakan dengan kualitas representasi populasi.","explanation":"Keterwakilan sampel terutama ditentukan oleh bagaimana peserta dapat masuk ke dalam sampel: siapa yang tercakup dalam kerangka sampel, siapa yang lebih mungkin terpilih, siapa yang tidak merespons, dan apakah peluang terpilih berkaitan dengan karakteristik yang diteliti. Menambah banyak responden dari sumber yang sudah bias dapat membuat galat baku menjadi kecil, tetapi estimasinya tetap bias. Jadi, ukuran sampel terutama membantu mengurangi variasi acak; ukuran sampel tidak otomatis memperbaiki bias seleksi. Pada survei sampling probabilitas, pembobotan dapat membantu dalam kondisi tertentu, tetapi tetap membutuhkan informasi dan asumsi yang memadai.","example":"Survei online dengan 20.000 responden sukarela dari satu komunitas media sosial dapat kurang mewakili populasi daripada sampling probabilitas 1.000 orang dengan kerangka sampel yang baik.","better_practice":"Jelaskan populasi sasaran, populasi terjangkau, kerangka sampel, rekrutmen, nonrespons, dan metode sampling. Gunakan N untuk membahas ketepatan, bukan sebagai bukti tunggal keterwakilan sampel.","reference":"United Nations Statistics Division (2026); STROBE Statement","reference_urls":"https://unstats.un.org/UNSDWebsite/statcom/session_57/documents/BG-3k-Handbook_on_Surveys_of_Household_and_Individuals-E.pdf|https://www.strobe-statement.org/checklists/"},{"category":"Sampling & Sample Size","myth":"Convenience sampling selalu tidak berguna.","short_correction":"Convenience sampling dapat berguna untuk tujuan tertentu, tetapi generalisasinya harus dibatasi.","why_it_seems_true":"Convenience sampling sering diajarkan sebagai kebalikan dari sampling probabilitas dan kemudian secara tidak sengaja diperlakukan sebagai “sampel yang salah” dalam semua keadaan.","explanation":"Convenience sampling dapat berguna untuk studi pilot, pengembangan instrumen tahap awal, studi kelayakan, penelitian eksploratif, atau eksperimen tertentu. Masalah utamanya bukan bahwa datanya otomatis tidak bernilai, tetapi bahwa peluang setiap anggota populasi untuk terpilih tidak diketahui. Karena itu, generalisasi ke populasi yang lebih luas membutuhkan kehati-hatian dan asumsi tambahan. Kualitas metode sampling harus selalu dinilai bersama tujuan penelitian. Sampel yang memadai untuk menguji fungsi awal sebuah aplikasi belum tentu memadai untuk mengestimasi prevalensi pada populasi nasional.","example":"Uji coba awal antarmuka pada 40 mahasiswa sukarela dapat sangat berguna untuk menemukan masalah penggunaan. Data yang sama tidak cukup untuk menyatakan seberapa sering masalah tersebut terjadi pada seluruh mahasiswa Indonesia.","better_practice":"Jelaskan mengapa convenience sampling dipilih, siapa yang kemungkinan terwakili atau tidak terwakili, dan batasi generalisasi sesuai karakteristik sampel serta tujuan penelitian.","reference":"STROBE Statement; APA JARS–Quant","reference_urls":"https://www.strobe-statement.org/checklists/|https://www.apa.org/pubs/journals/resources/apa-style-jars"},{"category":"Sampling & Sample Size","myth":"Jika tingkat respons tinggi, sampel pasti tidak bias.","short_correction":"Tingkat respons membantu, tetapi bias bergantung pada siapa yang tidak merespons dan mengapa.","why_it_seems_true":"Tingkat respons adalah indikator yang mudah dihitung, sehingga sering digunakan sebagai indikator tunggal untuk kualitas survei.","explanation":"Bias akibat nonrespons tidak hanya ditentukan oleh berapa persen orang yang menjawab, tetapi juga oleh siapa yang tidak menjawab dan apakah ketidakresponsan tersebut berkaitan dengan variabel yang ingin diestimasi. Tingkat respons yang tinggi memang sering lebih meyakinkan, tetapi bukan jaminan bahwa sampel bebas bias. Sebaliknya, tingkat respons yang lebih rendah belum tentu menghasilkan bias besar jika responden dan nonresponden cukup serupa pada aspek yang relevan atau penyesuaian yang digunakan bekerja dengan baik. Karena itu, evaluasi nonrespons perlu melihat proses rekrutmen, pola data hilang, informasi tentang nonresponden jika tersedia, serta ketahanan kesimpulan terhadap asumsi yang berbeda.","example":"Survei dengan tingkat respons 90% masih dapat bias jika 10% yang tidak merespons hampir seluruhnya berasal dari subkelompok yang memiliki outcome sangat berbeda.","better_practice":"Laporkan tingkat respons bersama mekanisme rekrutmen, karakteristik nonrespons bila tersedia, pembobotan (weighting) atau penyesuaian yang digunakan, dan batas generalisasi.","reference":"United Nations Statistics Division (2026)","reference_urls":"https://unstats.un.org/UNSDWebsite/statcom/session_57/documents/BG-3k-Handbook_on_Surveys_of_Household_and_Individuals-E.pdf"},{"category":"Desain Penelitian","myth":"Random sampling sama dengan random assignment.","short_correction":"Random sampling dan random assignment menjawab dua masalah yang berbeda.","why_it_seems_true":"Keduanya memakai kata “random”, sehingga mudah dianggap sebagai prosedur yang sama.","explanation":"Random sampling dan random assignment menggunakan unsur acak, tetapi tujuannya berbeda. Random sampling berkaitan dengan cara memilih peserta dari populasi dan terutama membantu generalisasi ke populasi jika prosedurnya benar. Random assignment berkaitan dengan cara menempatkan peserta yang sudah masuk penelitian ke kondisi atau kelompok dan terutama membantu membuat kelompok lebih sebanding sebelum intervensi. Sebuah eksperimen dapat memakai convenience sampling tetapi tetap melakukan random assignment. Sebaliknya, survei dapat memakai random sampling tanpa memberikan intervensi sama sekali. Karena itu, selalu pisahkan pertanyaan 'bagaimana peserta dipilih?' dari 'bagaimana peserta ditempatkan ke kondisi?'.","example":"Eksperimen laboratorium dapat merekrut sukarela mahasiswa secara convenience lalu menempatkan secara acak mereka ke dua kondisi. Penempatan acak membantu perbandingan sebab-akibat di dalam studi, tetapi tidak membuat sampel otomatis representatif dari seluruh populasi.","better_practice":"Selalu tulis secara terpisah: bagaimana peserta direkrut/dipilih dan bagaimana mereka dialokasikan ke kondisi.","reference":"CONSORT 2025; Hernán & Robins (2020)","reference_urls":"https://www.consort-spirit.org/published-statements|https://www.hsph.harvard.edu/miguel-hernan/causal-inference-book/"},{"category":"Desain Penelitian","myth":"Regresi yang signifikan membuktikan hubungan sebab-akibat.","short_correction":"Regresi menunjukkan pola hubungan; kesimpulan sebab-akibat memerlukan dukungan desain dan asumsi tambahan.","why_it_seems_true":"Kata prediktor, variabel independen, dan efek sering digunakan dalam output software sehingga hubungan statistik terdengar seperti hubungan sebab-akibat.","explanation":"Koefisien regresi menunjukkan pola hubungan setelah memperhitungkan variabel yang ada di dalam model. Hasil tersebut tidak otomatis menjadi efek sebab-akibat. Untuk membuat kesimpulan sebab-akibat, peneliti perlu mempertimbangkan urutan waktu, variabel perancu, cara peserta terpilih, kualitas pengukuran, bentuk hubungan antarvariabel, dan apakah ada jalur lain yang dapat menjelaskan hasil. Menambah kovariat juga tidak otomatis menghilangkan semua variabel perancu; pemilihan kovariat yang tidak tepat bahkan dapat menambah bias. Karena itu, pada penelitian observasional biasa, bahasa yang lebih aman adalah 'berhubungan dengan' atau 'berasosiasi dengan', kecuali desain dan asumsi memang mendukung interpretasi sebab-akibat.","example":"Cross-sectional regresi menemukan bahwa screen time berkaitan dengan GPA. Hasil ini tidak membuktikan bahwa mengurangi screen time akan meningkatkan GPA karena reverse hubungan sebab-akibat dan variabel perancu masih mungkin.","better_practice":"Gunakan bahasa “associated with” untuk analisis observasial biasa. Jika ingin klaim sebab-akibat, nyatakan estimand dan identifying asumsi serta gunakan desain/analisis yang memang mendukungnya.","reference":"Hernán & Robins (2020); APA JARS–Quant","reference_urls":"https:
