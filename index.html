<div class="two-col">${card(`<div class="mini-title">PREDIKTOR: ${safe(s.predictor,'belum diberi nama')}</div>${field('predictor_measure','Bagaimana prediktor diukur?',{placeholder:'Nama instrumen, skala, tugas, sumber data, atau definisi operasional'})}<div class="mini-title">OUTCOME: ${safe(s.outcome,'belum diberi nama')}</div>${field('outcome_measure','Bagaimana outcome diukur?',{placeholder:'Instrumen, skor atau catatan administratif'})}${extras.length?`<hr><h4>Pengukuran variabel tambahan</h4><p class="small">Jelaskan cara mengukur variabel lain, terutama mediator, moderator dan kovariat.</p>${extras.map(x=>`<div class="field"><label class="label">${esc(x.name)} · ${esc(ROLE[x.role])}</label><input type="text" data-extrameasure="${esc(x.name)}" value="${esc(s.extra_measures[x.name]||'')}" placeholder="Cara mengukur atau menentukan variabel"></div>`).join('')}`:''}${sel('measure_type','Jenis pengukuran utama',measureOptions)}${sel('instrument_strategy','Strategi pengukuran',strategy)}<div class="field"><label class="label">Bukti pengukuran yang sudah dipertimbangkan</label><div class="checks">${Object.entries(EVIDENCE).map(([key,label])=>`<label class="check-option"><input data-evidence="${esc(key)}" type="checkbox" ${s.measurement_evidence.includes(key)?'checked':''}>${esc(label)}</label>`).join('')}</div></div>${field('measurement_note','Catatan pengukuran',{type:'textarea',placeholder:'Contoh: bukti validitas sesuai penggunaan skor, reliabilitas sampel, dan cara penskoran.'})}`)}${card(`<div class="card-header">Peta bukti pengukuran</div><div class="evidence-list">${Object.entries(EVIDENCE).map(([k,label])=>`<div class="evidence-item ${s.measurement_evidence.includes(k)?'checked':''}"><span class="evidence-dot">${s.measurement_evidence.includes(k)?'✓':'•'}</span>${esc(label)}</div>`).join('')}</div>${note(s.learning_level,s.learning_level==='Foundation'?'Instrumen terkenal belum tentu cocok untuk semua populasi, tujuan atau interpretasi skor.':s.learning_level==='Intermediate'?'Validitas mendukung interpretasi/penggunaan skor, bukan label permanen “valid” pada instrumen.':'Pertimbangkan model pengukuran, invariance/DIF, fungsi informasi, error, fairness dan perubahan konstruk akibat adaptasi.')}${note('Miskonsepsi umum','Cronbach’s alpha tinggi tidak membuktikan validitas. Reliabilitas berkaitan dengan konsistensi/ketepatan skor; validitas dengan bukti interpretasi dan penggunaan. · Standards for Educational and Psychological Testing','warn')}`,'accent-card')}</div>${gloss(['reliability','validity','fairness','missing_data'])}`;}
function analysisExtras(){let x=s.additional_variables.filter(v=>v.name?.trim());return {all:x,extra:x.filter(v=>['Additional predictor','Covariate','Moderator'].includes(v.role)).length,cov:x.some(v=>v.role==='Covariate'),cluster:x.some(v=>v.role==='Cluster variable')};}
function analysisBoundary(){let d=L.design(s),causal=['Evaluate intervention','Explain mechanism'].includes(s.analysis_objective);if(causal&&d.family==='Observasional')return ['Hasil dapat digunakan untuk menilai pola hubungan atau efek tidak langsung statistik.','Jangan langsung menyimpulkan efek sebab-akibat atau mekanisme kausal dari data observasional tanpa asumsi tambahan.'];if(s.analysis_objective==='Predict')return ['Model dapat menunjukkan kinerja prediksi pada data dengan prosedur validasi yang sesuai.','Jangan menganggap prediksi akurat pada populasi baru hanya berdasarkan kinerja data pelatihan.'];if(d.family==='Eksperimental')return ['Estimasi efek kondisi yang diacak dapat mendukung perbandingan kausal dengan asumsi yang sesuai.','Jangan menggeneralisasikan tanpa memeriksa attrition, pelaksanaan, kualitas data, dan cakupan populasi.'];return ['Analisis dapat mengestimasi hubungan, perbedaan, atau parameter sesuai struktur data.','Jangan mengubah asosiasi statistik menjadi hubungan sebab-akibat tanpa dukungan desain dan asumsi.'];}
function analysisLayer(){let out=s.outcome_scale,obs=s.observations;return [['KEBUTUHAN STRUKTUR DATA',obs==='Repeated / paired'?'Pengukuran dari orang sama perlu dihubungkan lewat ID/pasangan; waktu atau kondisi harus tercatat.':'Periksa unit analisis, jenis variabel dan apakah peserta sesungguhnya independen.'],['ASUMSI MODEL',out==='Continuous'?'Periksa bentuk hubungan, pola galat, varians yang sesuai, serta ketergantungan observasi pada model yang dipilih.':out==='Binary'?'Periksa definisi kategori, observasi independen, kecukupan kejadian, dan bentuk logit bila memakai regresi.':'Periksa karakteristik kategori, keterurutan, frekuensi dan asumsi model ordinal/multinomial jika digunakan.'],['PEMERIKSAAN MODEL','Tinjau distribusi residual jika relevan, pengamatan berpengaruh, kecocokan model, serta data hilang.'],['KETAHANAN HASIL','Pertimbangkan analisis sensitivitas, alternatif model, pengaruh outlier dan kovariat yang dipilih berdasarkan alasan teori.']];}
function stepAnalysis(){let a=L.analysis(s),ex=analysisExtras(),bd=analysisBoundary(),problems=[];if(!s.outcome.trim())problems.push('outcome utama belum diberi nama');if(s.analysis_objective!=='Describe'&&!s.predictor.trim())problems.push('prediktor utama belum diberi nama');if(ex.cluster&&s.observations==='Independent')problems.push('ada variabel pengelompokan, tetapi observasi masih ditandai independen');let aligned=s.analysis_objective===s.objective;return `${moduleHeader(6,'Pencocok Analisis','Rekomendasi mempertimbangkan tujuan, jenis outcome, struktur prediktor, observasi dan variabel tambahan.')}<div class="two-col reverse">${card(`<div class="card-header">Struktur studi saat ini</div>${strip('Tujuan penelitian',OBJ[s.objective])}${strip('Prediktor utama',`${s.predictor||'Belum dinamai'} · ${SCALE[s.predictor_scale]}`)}${strip('Outcome utama',`${s.outcome||'Belum dinamai'} · ${SCALE[s.outcome_scale]}`)}${strip('Variabel tambahan',ex.all.length?ex.all.map(x=>x.name).join(', '):'Tidak ada')}${strip('Observasi',s.observations==='Independent'?'Peserta berbeda':'Berulang / berpasangan')}${sel('analysis_objective','Tujuan analisis yang ingin dijawab',OBJ)}${note(aligned?'Tujuan selaras':'Mode eksplorasi',aligned?'Tujuan analisis sama dengan tujuan penelitian pada Langkah 1.':'Tujuan analisis berbeda dari tujuan utama. Untuk Blueprint sebaiknya samakan kedua tujuan.',aligned?'':'warn')}${field('analysis_note','Catatan analisis (opsional)',{type:'textarea',placeholder:'Misalnya: pemeriksaan asumsi, rencana kovariat, multiple testing, data hilang...'})}`)}${card(`<div class="reco-kicker">REKOMENDASI UTAMA</div><h3>${esc(a.primary)}</h3>${badge(problems.length?'Masih membutuhkan keputusan':'Informasi utama cukup',problems.length?'warn':'')}${problems.length?ul(problems):'<p class="small">Keluarga analisis dapat direkomendasikan dari informasi saat ini; model akhir tetap perlu direncanakan.</p>'}<h5>Mengapa analisis ini?</h5><p>${esc(a.why)}</p><h5>Alternatif atau pengembangan</h5><p>${esc(a.alternative)}</p><div class="note warn"><strong>Jangan langsung memilih uji familiar</strong><p>${esc(a.not)}</p></div><h5>Apa yang sebaiknya dilaporkan?</h5><p>${esc(a.effect)}</p><div class="interpretation"><h5>Batas interpretasi</h5><div class="boundary"><strong>Masih dapat dikatakan</strong><p>${esc(bd[0])}</p></div><div class="boundary avoid"><strong>Jangan otomatis dikatakan</strong><p>${esc(bd[1])}</p></div></div><h5>Bedakan kebutuhan data, asumsi, pemeriksaan dan analisis sensitivitas</h5>${analysisLayer().map(([k,v])=>`<div class="assumption-layer"><strong>${k}</strong><p>${esc(v)}</p></div>`).join('')}${details('Dasar keputusan: mengapa app memberi rekomendasi ini?',Object.entries({'Tujuan analisis':OBJ[s.analysis_objective],'Outcome':SCALE[s.outcome_scale],'Prediktor':SCALE[s.predictor_scale],'Kelompok/kategori prediktor':s.groups,'Hubungan observasi':s.observations,'Prediktor/kovariat tambahan':ex.extra,'Variabel pengelompokan':ex.cluster?'Ada':'Tidak ada'}).map(([k,v])=>`<div class="decision-row"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join(''),true)}${details('Apa yang dapat mengubah rekomendasi?',ul(['Mengubah tujuan penelitian akan mengubah sasaran analisis.','Mengubah jenis outcome menjadi biner, ordinal, kontinu atau nominal akan mengubah model yang sesuai.','Menambah kelompok/kovariat, struktur berulang atau pengelompokan data dapat membutuhkan model lain.','Jika asumsi model tidak sesuai, pertimbangkan alternatif dan analisis sensitivitas.']))}${details('Apa yang masih belum diketahui?',ul(['Ukuran efek atau estimand utama yang ingin dilaporkan.','Distribusi dan kualitas data yang sebenarnya.','Prosedur pembersihan, data hilang, dan pemeriksaan model.','Unit observasi dan korelasi data dari kelompok atau pengukuran berulang.']))}${note(s.learning_level,s.learning_level==='Foundation'?'Periksa jenis outcome, jumlah kelompok, dan apakah pengukuran independen.':s.learning_level==='Intermediate'?'Perhatikan interval kepercayaan, ukuran efek, kovariat, asumsi dan multiple testing.':'Pastikan estimand, bentuk fungsi model, pengelompokan, strategi penanganan data hilang dan validasi.')}${note('Dasar aturan dan referensi','Aturan dapat ditelusuri dan mendukung pembelajaran, tetapi tidak menggantikan penyusunan model akhir. · APA JARS–Quant')}`,'accent-card')}</div>${gloss(['effect_size','confidence_interval','assumption','diagnostic','validation','multiplicity'])}`;}
function stepCoherence(){const rows=L.coherence(s),good=rows.filter(x=>x.status==='good').length;return `${moduleHeader(7,'Periksa Konsistensi Penelitian','Periksa apakah tujuan, variabel, desain, sampling, pengukuran, dan analisis sudah selaras.')}${card(`<div class="metric-duo"><div class="metric"><span>Aspek selaras</span><strong>${good} / ${rows.length}</strong></div><div class="metric"><span>Butuh perhatian</span><strong>${rows.length-good}</strong></div></div>${rows.map(x=>`<div class="status-row ${x.status}"><span class="status-dot"></span><div><h5>${esc(x.label)}</h5><p>${esc(x.feedback)}</p></div></div>`).join('')}${note('Apa arti status ini?','Status selaras hanya berarti aturan app tidak mendeteksi konflik yang sudah diprogram. Bukan sertifikat bahwa kualitas penelitian sudah terjamin.')}`)}`;}
function pending(){let a=[];if(!s.question.trim())a.push('Rumuskan pertanyaan penelitian utama secara spesifik.');if(!s.target_population.trim())a.push('Tentukan populasi sasaran yang ingin menjadi dasar generalisasi.');if(!s.inclusion_criteria.trim())a.push('Tentukan kriteria siapa yang dapat mengikuti penelitian.');if(!s.recruitment_procedure.trim())a.push('Jelaskan bagaimana peserta direkrut atau dipilih.');if(!Number.isFinite(s.planned_n))a.push('Justifikasi ukuran sampel dan target rekrutmen.');if(!s.predictor_measure.trim()||!s.outcome_measure.trim())a.push('Tentukan cara mengukur prediktor dan outcome utama.');if(s.measurement_evidence.length<3)a.push('Periksa bukti kualitas pengukuran seperti validitas, reliabilitas dan populasi.');if(L.analysis(s).primary==='Informasi tambahan masih diperlukan')a.push('Perjelas analisis utama yang menjawab pertanyaan.');if(!s.analysis_note.trim())a.push('Tambahkan catatan pemeriksaan asumsi, data hilang dan keputusan analisis.');if(s.analysis_objective!==s.objective)a.push('Samakan tujuan analisis dengan tujuan penelitian sebelum menjadikan blueprint sebagai rencana final.');return a;}
function followups(){let a=['Tentukan cara menangani data hilang dan respons yang tidak dapat digunakan.','Tetapkan aturan pembersihan dan penanganan outlier sebelum melihat hasil utama jika memungkinkan.','Pastikan keamanan data, perlindungan identitas dan persetujuan etik.','Laporkan perubahan rencana awal agar analisis konfirmatori dan eksploratif dapat dibedakan.'];if(['Compare','Associate','Predict','Explain mechanism','Evaluate intervention'].includes(s.objective))a.push('Jika ada banyak outcome, kelompok atau pengujian, tentukan analisis utama dan strategi multiple testing.');if(['Explain mechanism','Evaluate intervention'].includes(s.objective))a.push('Nyatakan asumsi yang dibutuhkan untuk interpretasi mekanisme atau efek sebab-akibat.');if(s.objective==='Predict')a.push('Tentukan validasi model dan metrik kinerja pada data baru atau resampling.');if(s.timepoints>1)a.push('Rencanakan penanganan attrition pada pengukuran lanjutan.');return a;}
const reporting=['Laporkan alasan memilih desain, populasi, metode sampling dan kriteria peserta.','Laporkan cara menentukan ukuran sampel, parameter, asumsi dan sumbernya.','Jelaskan instrumen atau prosedur serta bukti kualitas pengukuran yang relevan.','Laporkan analisis, perubahan dari rencana, data hilang, eksklusi dan pemeriksaan model.','Utamakan estimasi, interval ketidakpastian, ukuran efek atau kinerja prediksi, bukan p-value saja.'];
function variablesText(){let x=s.additional_variables.filter(v=>v.name?.trim());return x.length?x.map(v=>`${v.name} [${ROLE[v.role]}; ${SCALE[v.scale]}${v.scale==='Categorical'?`, ${v.categories} kategori`:''}]`).join('; '):'Tidak ada';}
function blueprintText(){let d=L.design(s),a=L.analysis(s);let lines=['BLUEPRINT PENELITIAN KUANTITATIF','=================================','','PERTANYAAN PENELITIAN',s.question||'Belum ditentukan',`Hipotesis: ${s.hypothesis||'Tidak ditentukan / opsional'}`,`Tujuan utama: ${OBJ[s.objective]}`,`Tujuan analisis: ${OBJ[s.analysis_objective]}`,`Populasi sasaran: ${s.target_population||s.population||'Belum ditentukan'}`,'','VARIABEL',`Prediktor utama: ${s.predictor||'Belum ditentukan'} [${SCALE[s.predictor_scale]}]`,`Outcome utama: ${s.outcome||'Belum ditentukan'} [${SCALE[s.outcome_scale]}]`,`Variabel tambahan: ${variablesText()}`,`Hubungan antarobservasi: ${s.observations}`,'','DESAIN',d.name,`Batas interpretasi: ${d.caution}`,'','PARTISIPAN & SAMPLING',`Populasi terjangkau: ${s.accessible_population}`,`Kerangka sampel: ${s.sampling_frame||'Belum ditentukan'}`,`Kriteria inklusi: ${s.inclusion_criteria||'Belum ditentukan'}`,`Kriteria eksklusi: ${s.exclusion_criteria||'Tidak ditentukan'}`,`Prosedur rekrutmen: ${s.recruitment_procedure||'Belum ditentukan'}`,`Metode sampling: ${s.sampling_method}`,`Target dianalisis: ${Number.isFinite(s.analysis_n)?s.analysis_n:'Belum ditentukan'}`,`Target rekrutmen: ${Number.isFinite(s.planned_n)?s.planned_n:'Belum ditentukan'}`,`Justifikasi: ${s.sample_size_note||'Belum dihitung'}`,...s.sample_size_trace.map(x=>`- ${x}`),`Referensi ukuran sampel: ${s.sample_size_references.join('; ')||'Belum ditentukan'}`,'','PENGUKURAN',`Jenis: ${s.measure_type}`,`Strategi: ${s.instrument_strategy}`,`Prediktor: ${s.predictor_measure||'Belum ditentukan'}`,`Outcome: ${s.outcome_measure||'Belum ditentukan'}`,`Pengukuran tambahan: ${JSON.stringify(s.extra_measures)}`,`Bukti yang dipertimbangkan: ${s.measurement_evidence.map(x=>EVIDENCE[x]).join('; ')}`,`Catatan: ${s.measurement_note}`,'','RENCANA ANALISIS',a.primary,`Alasan: ${a.why}`,`Catatan: ${s.analysis_note||'Belum ditentukan'}`,'','CATATAN KONSISTENSI',...L.coherence(s).map(x=>`- ${x.label}: ${x.status.toUpperCase()} — ${x.feedback}`),'','MASIH PERLU DIPUTUSKAN',...(pending().length?pending():['Semua keputusan inti yang dipantau sudah terisi.']).map(x=>`- ${x}`),'','KEPUTUSAN SEBELUM PENGUMPULAN DATA',...followups().map(x=>`- ${x}`),'','HAL YANG PERLU DILAPORKAN',...reporting.map(x=>`- ${x}`),'','REFERENSI INTI','Appelbaum et al. (2018). APA JARS–Quant. https://doi.org/10.1037/amp0000191','von Elm et al. (2007). STROBE. https://doi.org/10.1371/journal.pmed.0040296','Hopewell et al. (2025). CONSORT 2025. https://doi.org/10.1136/bmj-2024-081123','AERA, APA & NCME (2014). Standards for Educational and Psychological Testing.','International Test Commission (2018). Translating and Adapting Tests.','Lakens (2022). Sample Size Justification. https://doi.org/10.1525/collabra.33267','','Catatan: Blueprint merupakan alat bantu belajar dan perencanaan, bukan validasi otomatis atas suatu desain penelitian.'];return lines.join('\n');}
function stepBlueprint(){const d=L.design(s),a=L.analysis(s),issues=L.coherence(s).filter(x=>x.status!=='good'),waiting=pending();return `${moduleHeader(8,'Blueprint Penelitian','Tinjau rencana yang saling terhubung sebelum mulai mengumpulkan data.')}
<div class="two-col">${card(`<div class="bp-section"><h5>Pertanyaan penelitian</h5><p>${safe(s.question)}</p><small>${s.hypothesis?`Hipotesis: ${esc(s.hypothesis)}`:'Hipotesis belum ditentukan (opsional).'}</small></div><div class="bp-two"><div class="bp-section"><h5>Desain</h5><p>${esc(d.name)}</p></div><div class="bp-section"><h5>Rencana analisis</h5><p>${esc(a.primary)}</p></div></div><div class="bp-section"><h5>Variabel</h5><p>${safe(s.predictor)} → ${safe(s.outcome)}</p><small>Variabel tambahan: ${esc(variablesText())}</small></div><div class="bp-two"><div class="bp-section"><h5>Partisipan</h5><p>${esc(s.sampling_method)} · ${Number.isFinite(s.planned_n)?`target N = ${fmt(s.planned_n)}`:'N belum ditentukan'}</p><small>${safe(s.inclusion_criteria,'Kriteria inklusi belum ditentukan')}</small></div><div class="bp-section"><h5>Pengukuran</h5><p>${esc(s.instrument_strategy)}</p><small>${s.measurement_evidence.length} aspek bukti pengukuran dipertimbangkan</small></div></div><div class="bp-section"><h5>Batas interpretasi</h5><p>${esc(d.caution)}</p></div><div class="bp-section"><h5>Hal yang masih perlu diperhatikan</h5>${issues.length?ul(issues.map(x=>x.feedback)):'<p>Tidak ada konflik utama yang terdeteksi oleh aturan saat ini.</p>'}</div><div class="bp-highlight"><h5>Masih perlu diputuskan</h5>${waiting.length?ul(waiting):'<p>Semua keputusan inti yang diperiksa app sudah terisi; tinjau keputusan lanjutan di bawah.</p>'}</div><div class="bp-section"><h5>Keputusan lanjutan sebelum pengumpulan data</h5>${ul(followups())}</div>${details('Apa yang perlu dilaporkan nanti?',ul(reporting))}${note('Blueprint bukan sertifikat kualitas penelitian','Status selaras tidak mengevaluasi seluruh teori, bias yang tidak terukur, data masa depan, atau kualitas pelaksanaan penelitian.')}`)}${card(`<h4>Ekspor dan penyimpanan</h4><p>Unduh blueprint dengan semua keputusan, pemeriksaan konsistensi, langkah kalkulasi ukuran sampel dan referensi.</p><div class="button-row" style="flex-direction:column;align-items:stretch"><button class="btn primary full" data-action="download-blueprint">Unduh Blueprint (.txt)</button><button class="btn secondary full" data-action="download-state">Simpan rancangan (.json)</button><button class="btn secondary full" data-action="import-state">Buka rancangan (.json)</button><input id="import-file" type="file" accept="application/json,.json" hidden></div>${note('Data tersimpan secara lokal','Pengisian otomatis tersimpan di browser ini (localStorage), bukan di server atau spreadsheet. Unduh JSON untuk memindahkan rancangan ke perangkat lain.')} ${note('Sebelum mengumpulkan data','Pertimbangkan preregistrasi, persetujuan etik, keamanan data, aturan eksklusi, dan pedoman pelaporan.')}`,'accent-card')}</div>`;}
function drawDownload(filename,content,mime='text/plain;charset=utf-8'){let blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exampleLoad(){let e=D.examples.find(x=>x.id===ui.exampleId);if(!e)return;const fields=['question','objective','population','hypothesis','predictor','predictor_scale','outcome','outcome_scale','observations','intervention','randomized','same_participants','sampling_method','target_population','accessible_population','inclusion_criteria','exclusion_criteria','recruitment_procedure','predictor_measure','outcome_measure'];for(let x of fields)if(e[x]!==undefined)s[x]=e[x];s.groups=Math.max(2,Number(e.groups)||2);s.outcome_categories=Math.max(2,Number(e.outcome_categories)||3);s.timepoints=Number(e.timepoints)||1;s.additional_variables=(e.additional_variables||'').split(';;').filter(x=>x.trim()).map(x=>{let [name,role,scale,categories]=x.split('|');return {name:name||'',role:role||'Additional predictor',scale:scale||'Continuous',categories:Number(categories)||3};});s.analysis_objective=s.objective;s.target_population=s.target_population||s.population;s.measurement_evidence=['Construct alignment','Population relevance','Reliability / precision','Validity evidence'];s.extra_measures={};s.planned_n=null;s.analysis_n=null;s.sample_size_note='';s.sample_size_trace=[];s.sample_size_references=[];ui.step=0;preserve();render();toast('Contoh penelitian berhasil dimuat.');}
function makeLink(url,label){const u=String(url||'').trim();return /^https?:\/\//i.test(u)?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(label||u)}</a>`:esc(label||u);}
function refLinks(ref,urls){const rr=String(ref||'').split(';').map(x=>x.trim()).filter(Boolean),uu=String(urls||'').split('|').map(x=>x.trim());return rr.map((x,i)=>makeLink(uu[i],x)).join(' · ');}
function mythTarget(m){let myth=(m.myth||'').toLowerCase(),cat=m.category||'';if(/power|ukuran sampel|populasi/.test(myth))return ['explore','sample_size','Buka lab ukuran sampel'];if(cat==='Sampling & Sample Size')return ['journey','Participants','Buka perencanaan partisipan'];if(cat==='Measurement')return ['journey','Measurement','Buka lab pengukuran'];if(cat==='Research Design')return ['journey','Design','Buka lab desain'];if(cat==='Assumptions & Diagnostics')return ['explore','assumptions','Coba eksplorasi asumsi'];if(['Regression & Modeling','Statistical Significance','Researcher Decisions','Missing Data & Data Quality'].includes(cat))return ['journey','Analysis','Buka pencocok analisis'];return ['explore','glossary','Buka glosarium'];}

let randSeed=149273;
function random(){randSeed=(randSeed*1664525+1013904223)>>>0;return randSeed/4294967296;}
function randn(){let x=Math.max(1e-12,random()),y=random();return Math.sqrt(-2*Math.log(x))*Math.cos(2*Math.PI*y);}
function simulatePower(){let rho=Number(ui.sim_r),n=Number(ui.sim_n),reps=Number(ui.sim_reps),v=[],significant=0;for(let j=0;j<reps;j++){let sx=0,sy=0,sxx=0,syy=0,sxy=0;for(let i=0;i<n;i++){let x=randn(),y=rho*x+Math.sqrt(1-rho*rho)*randn();sx+=x;sy+=y;sxx+=x*x;syy+=y*y;sxy+=x*y;}let r=(n*sxy-sx*sy)/Math.sqrt(Math.max(1e-14,(n*sxx-sx*sx)*(n*syy-sy*sy)));r=Math.max(-.99999,Math.min(.99999,r));v.push(r);let f=(n-2)*r*r/(1-r*r),p=1-L.fCdf(f,1,n-2);if(p<.05)significant++;}ui.simData={values:v,significant,reps,rho};}
function simulateAssumptions(){const n1=Number(ui.n1),n2=Number(ui.n2),diff=Number(ui.mean_diff),vr=Number(ui.variance_ratio);ui.assumpData={a:Array.from({length:n1},()=>randn()),b:Array.from({length:n2},()=>diff+Math.sqrt(vr)*randn())};}
function prepareCanvas(el){if(!el)return null;const bounds=el.getBoundingClientRect(),w=Math.max(320,bounds.width||650),h=Math.max(200,bounds.height||310),dpr=window.devicePixelRatio||1;el.width=Math.round(w*dpr);el.height=Math.round(h*dpr);let ctx=el.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);ctx.font='12px system-ui,sans-serif';ctx.lineWidth=1;return {ctx,w,h};}
function axes(c,w,h,left=46,bottom=40){let x0=left,y0=h-bottom;c.strokeStyle='#a5bdb1';c.lineWidth=1;c.beginPath();c.moveTo(x0,12);c.lineTo(x0,y0);c.lineTo(w-15,y0);c.stroke();return [x0,y0,w-15-x0,y0-16];}
function drawHistogram(){let el=document.getElementById('power-chart');if(!el||!ui.simData)return;let obj=prepareCanvas(el);if(!obj)return;let {ctx:c,w,h}=obj,[x0,y0,pw,ph]=axes(c,w,h);let values=ui.simData.values,min=Math.min(-.35,Math.min(...values)),max=Math.max(.6,Math.max(...values)),buckets=26,counts=Array(buckets).fill(0);for(let x of values){let i=Math.max(0,Math.min(buckets-1,Math.floor((x-min)/(max-min)*buckets)));counts[i]++;}let peak=Math.max(...counts,1);c.fillStyle='#4e9181';counts.forEach((num,i)=>{let bh=num/peak*ph,bw=pw/buckets;c.fillRect(x0+i*bw+.6,y0-bh,bw-1.2,bh);});let x=x0+(ui.simData.rho-min)/(max-min)*pw;c.strokeStyle='#9f7440';c.setLineDash([5,5]);c.lineWidth=2;c.beginPath();c.moveTo(x,15);c.lineTo(x,y0);c.stroke();c.setLineDash([]);c.fillStyle='#667e74';for(let i=0;i<=5;i++){let val=min+(max-min)*i/5;c.fillText(val.toFixed(2),x0+pw*i/5-12,y0+19);}c.fillText('Korelasi yang diperoleh dari studi simulasi',x0+Math.max(0,pw/2-135),h-9);let summary=document.getElementById('power-summary');summary.innerHTML=`<div class="big-number">${fmt(ui.simData.significant/ui.simData.reps*100,1)}%</div><p>dari ${fmt(ui.simData.reps,0)} studi simulasi menghasilkan <em>p</em> &lt; .05 (alpha = .05), dengan korelasi populasi ${fmt(ui.simData.rho)}.</p>`;}
function drawFPC(){let el=document.getElementById('fpc-chart');if(!el)return;let ob=prepareCanvas(el);if(!ob)return;let {ctx:c,w,h}=ob,[x0,y0,pw,ph]=axes(c,w,h);let N=Math.max(50,Number(ui.fpc_population)),base=L.sample.proportion(Number(ui.fpc_prop),Number(ui.fpc_margin),Number(ui.fpc_conf)),adj=L.sample.fpc(base,N),xMax=Math.max(100000,N*3),logMin=Math.log(50),logMax=Math.log(xMax),maxY=Math.ceil(base*1.07/20)*20;let xy=(n)=>([x0+(Math.log(n)-logMin)/(logMax-logMin)*pw,y0-L.sample.fpc(base,n)/maxY*ph]);c.strokeStyle='#38826e';c.lineWidth=2.7;c.beginPath();for(let i=0;i<=160;i++){let pop=Math.exp(logMin+(logMax-logMin)*i/160);let [x,y]=xy(pop);if(i===0)c.moveTo(x,y);else c.lineTo(x,y);}c.stroke();c.strokeStyle='#bd9160';c.setLineDash([5,4]);c.beginPath();c.moveTo(x0,y0-base/maxY*ph);c.lineTo(x0+pw,y0-base/maxY*ph);c.stroke();c.setLineDash([]);let [xn,yn]=xy(N);c.fillStyle='#3b927e';c.beginPath();c.arc(xn,yn,5,0,2*Math.PI);c.fill();c.fillStyle='#58716a';let ticks=[50,100,500,1000,5000,10000,50000,100000,500000,1000000].filter(v=>v<=xMax);for(let t of ticks){let x=x0+(Math.log(t)-logMin)/(logMax-logMin)*pw;c.fillText(t>=1000?`${t/1000}k`:t,x-9,y0+18);}for(let i=0;i<5;i++)c.fillText(fmt(maxY*i/4,0),3,y0-ph*i/4+4);c.fillText('Jumlah populasi (skala log)',x0+Math.max(0,pw/2-70),h-8);document.getElementById('fpc-summary').innerHTML=`<div class="metric-duo"><div class="metric"><span>Jika populasi sangat besar</span><strong>N ≈ ${fmt(base,0)}</strong></div><div class="metric"><span>Jika populasi ${fmt(N,0)}</span><strong>N ≈ ${fmt(adj,0)}</strong></div></div><p style="margin-top:15px">Setelah FPC, sampel mencakup sekitar ${fmt(adj/N*100,1)}% populasi. Asumsi: simple random sampling tanpa penggantian.</p>`;}
function descript(x){let n=x.length,mean=x.reduce((a,b)=>a+b,0)/n,variance=x.reduce((a,b)=>a+(b-mean)**2,0)/(n-1);return {n,mean,var:variance,sd:Math.sqrt(variance)};}
function tCompare(){let a=descript(ui.assumpData.a),b=descript(ui.assumpData.b),diff=a.mean-b.mean,sp=((a.n-1)*a.var+(b.n-1)*b.var)/(a.n+b.n-2),tS=diff/Math.sqrt(sp*(1/a.n+1/b.n)),dfS=a.n+b.n-2,se1=a.var/a.n,se2=b.var/b.n,tW=diff/Math.sqrt(se1+se2),dfW=(se1+se2)**2/(se1*se1/(a.n-1)+se2*se2/(b.n-1));return {a,b,pStudent:1-L.fCdf(tS*tS,1,dfS),pWelch:1-L.fCdf(tW*tW,1,dfW)};}
function drawAssumptions(){let el=document.getElementById('assump-chart');if(!el)return;let ob=prepareCanvas(el);if(!ob)return;if(!ui.assumpData)simulateAssumptions();let {ctx:c,w,h}=ob,[x0,y0,pw,ph]=axes(c,w,h);const aa=ui.assumpData.a,bb=ui.assumpData.b,all=[...aa,...bb],mn=Math.min(...all)-.5,mx=Math.max(...all)+.5;let y=v=>y0-(v-mn)/(mx-mn)*ph;const quant=(arr,p)=>{let x=[...arr].sort((a,b)=>a-b),at=p*(x.length-1),i=Math.floor(at);return x[i]+(x[Math.min(i+1,x.length-1)]-x[i])*(at-i);};for(let [i,arr] of [aa,bb].entries()){const x=x0+pw*(i===0?.30:.71);c.fillStyle=i===0?'rgba(47,132,110,.42)':'rgba(217,150,79,.42)';for(let val of arr){let jit=(random()-.5)*65;c.beginPath();c.arc(x+jit,y(val),2.5,0,2*Math.PI);c.fill();}let [q1,med,q3]=[.25,.5,.75].map(p=>quant(arr,p)),lo=Math.min(...arr),hi=Math.max(...arr);c.fillStyle=i===0?'rgba(47,132,110,.22)':'rgba(217,150,79,.22)';c.strokeStyle=i===0?'#267a67':'#b27c46';c.fillRect(x-30,y(q3),60,y(q1)-y(q3));c.strokeRect(x-30,y(q3),60,y(q1)-y(q3));c.beginPath();c.moveTo(x-30,y(med));c.lineTo(x+30,y(med));c.moveTo(x,y(q3));c.lineTo(x,y(hi));c.moveTo(x,y(q1));c.lineTo(x,y(lo));c.stroke();c.fillStyle='#536e62';c.fillText(i===0?'Kelompok A':'Kelompok B',x-34,y0+22);}c.fillStyle='#748b7f';for(let i=0;i<=4;i++){let val=mn+(mx-mn)*i/4;c.fillText(val.toFixed(1),5,y(val)+4);}const out=tCompare();document.getElementById('assump-summary').innerHTML=`<div class="metric-duo"><div class="metric"><span>Student t-test</span><strong>p ${out.pStudent<.001?'&lt; 0,001':'= '+fmtP(out.pStudent)}</strong></div><div class="metric"><span>Welch t-test</span><strong>p ${out.pWelch<.001?'&lt; 0,001':'= '+fmtP(out.pWelch)}</strong></div></div><p class="small" style="margin-top:14px">N(A) = ${out.a.n}; N(B) = ${out.b.n}; rasio varians sampel B/A ≈ ${fmt(out.b.var/out.a.var)}.</p>`;}

 let el=ev.target.closest('[data-nav],[data-step],[data-subtab],[data-explore],[data-action],[data-jump]');if(!el)return;
 if(el.dataset.nav){ev.preventDefault();navigate(el.dataset.nav);return;}
 if(el.dataset.step!==undefined){ui.step=Number(el.dataset.step);render();window.scrollTo({top:130,behavior:'instant'});return;}
 if(el.dataset.subtab){ui.partTab=el.dataset.subtab;render();return;}
 if(el.dataset.explore){ui.exploreTab=el.dataset.explore;render();return;}
 if(el.dataset.jump){if(el.dataset.jump==='journey'){navigate('journey',Math.max(0,STEPS.indexOf(el.dataset.target)));}else{ui.exploreTab=el.dataset.target;navigate('explore');}return;}
 let action=el.dataset.action;
 if(action==='start-journey')navigate('journey',0);
 else if(action==='start-challenges')navigate('challenges');
 else if(action==='next-step'){ui.step=Math.min(7,ui.step+1);render();window.scrollTo({top:125,behavior:'instant'});}
 else if(action==='prev-step'){ui.step=Math.max(0,ui.step-1);render();window.scrollTo({top:125,behavior:'instant'});}
 else if(action==='load-example')exampleLoad();
 else if(action==='reset'){if(confirm('Reset seluruh isian Alur Penelitian pada browser ini?')){s=structuredClone(DEFAULT);ui.step=0;ui.partTab='sampling';preserve();render();toast('Rancangan direset.');}}
 else if(action==='add-extra'){if(s.additional_variables.length<8){s.additional_variables.push({name:'',role:'Additional predictor',scale:'Continuous',categories:3});preserve();render();}}
 else if(action==='remove-extra'){s.additional_variables.pop();preserve();render();}
 else if(action==='calc-sample')calcSample();
 else if(action==='download-blueprint')drawDownload(`study-blueprint-${new Date().toISOString().slice(0,10)}.txt`,blueprintText());
 else if(action==='download-state')drawDownload(`qrm-study-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({app:'Quantitative Research Methods Lab',version:'1.8.1-html',study:s},null,2),'application/json');
 else if(action==='import-state')document.getElementById('import-file')?.click();
 else if(action==='run-sim'){simulatePower();render();toast('Simulasi selesai.');}
 else if(action==='regen'){simulateAssumptions();render();toast('Data baru disimulasikan.');}
 else if(action==='check-challenge'){if(!ui.chosen)return;if(!ui.checked){ui.attempted++;if(ui.chosen===D.challenges[ui.caseIndex].answer)ui.correct++;}ui.checked=true;render();}
 else if(action==='next-case'){ui.caseIndex=(ui.caseIndex+1)%D.challenges.length;ui.chosen='';ui.checked=false;render();}
 else if(action==='reset-challenges'){ui.caseIndex=ui.correct=ui.attempted=0;ui.chosen='';ui.checked=false;render();}
 });
 app.addEventListener('input',ev=>{let el=ev.target;if(!(el.dataset.field||el.dataset.ui||el.dataset.extra!==undefined||el.dataset.extrameasure!==undefined||el.dataset.evidence))return;if(el.type==='checkbox'||el.type==='radio')return;doUpdate(el);if(el.type==='range'){let out=el.closest('.field')?.querySelector('output');if(out)out.textContent=fmt(el.value)+(el.dataset.field?.endsWith('_pct')?'%':'');return;}if(el.type==='text'||el.tagName==='TEXTAREA'){clearTimeout(searchTimer);searchTimer=setTimeout(()=>{if(ui.tab==='explore'&&ui.exploreTab==='glossary'){let x=document.getElementById('glossary-results');if(x)x.innerHTML=glossaryView();}else if(ui.tab==='explore'&&ui.exploreTab==='misconceptions'){let x=document.getElementById('myths-results');if(x)x.innerHTML=mythsView();}else if(ui.tab==='references'){rerenderWithFocus();}},260);}}
 );
 app.addEventListener('change',ev=>{let el=ev.target;if(el.dataset.answer){if(ui.checked)return;ui.chosen=el.dataset.answer;render();return;}if(el.id==='import-file'){let f=el.files?.[0];if(!f)return;f.text().then(x=>{let parsed=JSON.parse(x);if(!parsed.study||typeof parsed.study!=='object'||!('objective' in parsed.study))throw Error('Format JSON tidak valid');s={...structuredClone(DEFAULT),...parsed.study};s.additional_variables=Array.isArray(s.additional_variables)?s.additional_variables:[];s.extra_measures=s.extra_measures||{};s.measurement_evidence=Array.isArray(s.measurement_evidence)?s.measurement_evidence:[];preserve();render();toast('Rancangan berhasil dimuat.');}).catch(e=>{console.error(e);toast('Tidak dapat memuat JSON: periksa format file.');});return;}if(el.dataset.field||el.dataset.ui||el.dataset.extra!==undefined||el.dataset.extrameasure!==undefined||el.dataset.evidence){doUpdate(el);if(el.type==='text'||el.type==='number'||el.tagName==='TEXTAREA')return;render();}});
 }
 document.getElementById('mobile-menu').addEventListener('click',()=>{let n=document.getElementById('primary-nav');n.classList.toggle('open');document.getElementById('mobile-menu').setAttribute('aria-expanded',String(n.classList.contains('open')));});
 window.addEventListener('resize',()=>{if(['power','sample_size','assumptions'].includes(ui.exploreTab)&&ui.tab==='explore')drawRelevant();});
 const fromHash=location.hash.slice(1);if(['home','journey','explore','challenges','references'].includes(fromHash))ui.tab=fromHash;
 if(!Array.isArray(s.additional_variables))s.additional_variables=[];
 if(!Array.isArray(s.measurement_evidence))s.measurement_evidence=[];
 if(!s.extra_measures||typeof s.extra_measures!=='object')s.extra_measures={};
 handlers();render();
 // Expose pure preview helpers for repeatable browser smoke tests; no personal data shared.
 window.QRM_TEST={getState:()=>structuredClone(s),getUI:()=>({...ui}),blueprintText,simulatePower,calcSample};
})();

</script>
</body>
