//www.hsph.harvard.edu/miguel-hernan/causal-inference-book/|https://www.apa.org/pubs/journals/resources/apa-style-jars"},{"category":"Desain Penelitian","myth":"Mediation yang signifikan membuktikan mekanisme sebab-akibat.","short_correction":"Efek tidak langsung tidak otomatis mengidentifikasi mekanisme sebab-akibat.","why_it_seems_true":"Diagram X → M → Y terlihat seperti urutan sebab-akibat dan software mediation menghasilkan efek tidak langsung yang mudah ditafsirkan sebagai mekanisme.","explanation":"Analisis mediation dapat menunjukkan pola statistik yang sesuai dengan gagasan bahwa X berhubungan dengan Y melalui M. Namun pola tersebut belum cukup untuk membuktikan bahwa M benar-benar merupakan mekanisme sebab-akibat. Interpretasi kausal membutuhkan urutan waktu yang masuk akal dan asumsi yang kuat tentang variabel perancu pada hubungan X–M, M–Y, dan X–Y. Jika X, M, dan Y semuanya diukur pada saat yang sama, urutan prosesnya semakin sulit dipastikan. Indirect effect yang signifikan juga tidak menyingkirkan kemungkinan arah hubungan lain atau model alternatif. Karena itu, mediation sebaiknya ditafsirkan sesuai kekuatan desain dan teori yang mendasarinya.","example":"Self-efficacy, engagement, dan GPA diukur satu kali. Efek tidak langsung self-efficacy → engagement → GPA signifikan. Ini belum membuktikan engagement adalah mekanisme sebab-akibat yang terjadi di antara keduanya.","better_practice":"Gunakan desain dengan urutan waktu yang didasarkan pada teori, pertimbangkan longitudinal/bukti eksperimental, laporkan efek tidak langsung dengan ketidakpastian, dan nyatakan identifying asumsi serta alternatif penjelasan.","reference":"Maxwell & Cole (2007); Hernán & Robins (2020)","reference_urls":"https://doi.org/10.1037/1082-989X.12.1.23|https://www.hsph.harvard.edu/miguel-hernan/causal-inference-book/"},{"category":"Desain Penelitian","myth":"Pretest–posttest tanpa kelompok kontrol cukup untuk menyimpulkan efek intervensi.","short_correction":"Perubahan waktu saja tidak memisahkan intervensi dari perubahan lain dari waktu ke waktu, perkembangan alami, atau regression to the mean (regresi menuju rata-rata).","why_it_seems_true":"Jika skor membaik setelah intervensi, perubahan tersebut secara intuitif terasa sebagai akibat intervensi.","explanation":"Pada desain satu kelompok pretest–posttest, peneliti dapat menunjukkan bahwa outcome berubah dari sebelum ke sesudah intervensi. Masalahnya, perubahan tersebut belum tentu disebabkan oleh intervensi. Perubahan dapat muncul karena peristiwa lain selama penelitian, perkembangan alami peserta, pengulangan pengukuran, perubahan cara pengukuran, regression to the mean (regresi menuju rata-rata), atau kehilangan peserta tertentu. Kelompok pembanding membantu memperkirakan apa yang mungkin terjadi jika intervensi tidak diberikan. Jika penempatan ke kondisi dilakukan secara acak dan pelaksanaan penelitian baik, dasar untuk membandingkan efek intervensi menjadi lebih kuat.","example":"Anxiety menurun setelah workshop dua minggu. Tanpa kelompok pembanding, penurunan bisa terjadi karena masa ujian sudah selesai pada saat posttest.","better_practice":"Gunakan kelompok pembanding yang sesuai bila memungkinkan, tentukan besaran efek intervensi yang ingin diestimasi, dan jelaskan keterbatasan kesimpulan jika desain tidak memungkinkan penempatan acak.","reference":"CONSORT 2025; APA JARS–Quant","reference_urls":"https://www.consort-spirit.org/published-statements|https://www.apa.org/pubs/journals/resources/apa-style-jars"},{"category":"Pengukuran","myth":"Cronbach’s alpha tinggi berarti instrumen valid.","short_correction":"Reliabilitas dan validitas adalah dua pertanyaan yang berbeda.","why_it_seems_true":"Alpha mudah dihitung dan sering menjadi satu-satunya angka psikometrik yang dilaporkan, sehingga lama-lama diperlakukan sebagai “uji kualitas instrumen”.","explanation":"Cronbach's alpha adalah salah satu koefisien yang digunakan untuk menilai konsistensi internal skor di bawah asumsi tertentu. Nilai alpha yang tinggi tidak menunjukkan bahwa item benar-benar mengukur konstruk yang dimaksud, bahwa interpretasi skor cocok untuk populasi tertentu, atau bahwa instrumen adil untuk tujuan penggunaannya. Alpha juga dapat meningkat karena jumlah item yang banyak atau karena item terlalu mirip satu sama lain. Validitas membutuhkan kumpulan bukti yang mendukung interpretasi dan penggunaan skor. Karena itu, reliabilitas merupakan bagian penting dari kualitas pengukuran, tetapi bukan bukti validitas yang berdiri sendiri.","example":"Skala 30 item yang semuanya menanyakan hal hampir sama dapat menghasilkan alpha .95, tetapi mungkin hanya mencakup sebagian sempit dari konstruk dan gagal membedakan konstruk lain yang berdekatan.","better_practice":"Evaluasi konstruk definition, content, struktur internal, hubungan with other variabels, proses responss, reliabilitas/ketepatan, populasi relevance, dan tujuan penggunaan sesuai kebutuhan.","reference":"Standards for Educational and Psychological Testing; Sijtsma (2009)","reference_urls":"https://www.testingstandards.net/|https://doi.org/10.1007/s11336-008-9101-0"},{"category":"Pengukuran","myth":"Cronbach's alpha di atas .70 adalah batas universal untuk reliabilitas yang baik.","short_correction":"Tidak ada satu batas nilai yang cocok untuk semua penggunaan skor.","why_it_seems_true":"Batas nilai .70 sering dikutip sebagai aturan praktis dan mudah digunakan untuk memberi label “reliabel/tidak reliabel”.","explanation":"Kecukupan reliabilitas/ketepatan bergantung pada interpretasi yang dimaksud, keputusan yang akan dibuat, rentang skor, populasi, panjang tes, dan dampak kesalahan. Nilai yang mungkin cukup untuk eksploratif penelitian pada tingkat kelompok belum tentu cukup untuk keputusan individual berisiko tinggi. Sebaliknya, koefisien sedikit di bawah .70 tidak otomatis membuat data tidak berguna. Selain itu alpha sendiri membutuhkan asumsi tertentu dan bukan selalu estimasi reliabilitas terbaik. Fokus yang lebih tepat adalah besarnya nilai, ketidakpastian, pengukuran model, dan dampak kesalahan pengukuran terhadap kesimpulan statistik.","example":"Reliabilitas .75 mungkin cukup untuk eksplorasi kelompok-level, tetapi dapat terlalu rendah jika skor digunakan untuk keputusan individual yang berdampak.","better_practice":"Laporkan koefisien yang sesuai model, interval kepercayaan bila memungkinkan, jelaskan penggunaan skor, dan hindari menyimpulkan kualitas hanya dari ambang mekanis.","reference":"Standards for Educational and Psychological Testing; Sijtsma (2009)","reference_urls":"https://www.testingstandards.net/|https://doi.org/10.1007/s11336-008-9101-0"},{"category":"Pengukuran","myth":"Instrumen yang sudah valid pada penelitian sebelumnya pasti valid untuk semua populasi.","short_correction":"Bukti validitas harus dinilai untuk interpretasi, populasi, dan tujuan penggunaan tertentu.","why_it_seems_true":"Istilah “kuesioner yang sudah divalidasi” sering terdengar seperti sertifikat permanen yang berlaku lintas bahasa, budaya, usia, dan tujuan.","explanation":"Evidence yang mendukung skor interpretasi dapat berubah ketika populasi, bahasa, cara administrasi, konsekuensi penggunaan, atau tujuan penggunaan berubah. Penerjemahan juga bukan sekadar mengganti kata; kesetaraan konstruk, fungsi item, proses respons, dan norma lokal dapat perlu diperiksa. Karena itu menggunakan skala terkenal tidak menghilangkan kebutuhan untuk menilai relevansi bukti pada sampel dan tujuan baru. Validitas sebaiknya dipandang sebagai argumen yang diperbarui, bukan atribut biner yang menempel selamanya pada instrumen.","example":"Skala kerja yang dikembangkan untuk pekerja profesional dewasa tidak otomatis memiliki interpretasi yang sama ketika digunakan pada siswa SMA setelah diterjemahkan.","better_practice":"Tinjau bukti pada populasi dan bahasa yang relevan, dokumentasikan adaptasi, dan kumpulkan bukti tambahan jika tujuan penggunaan berbeda secara material.","reference":"Standards for Educational and Psychological Testing; ITC Guidelines for Translating and Adapting Tests","reference_urls":"https://www.testingstandards.net/|https://www.intestcom.org/files/guideline_test_adaptation_2ed.pdf"},{"category":"Pengukuran","myth":"Jika factor loading item tinggi, item pasti bagus.","short_correction":"Factor loading hanya memberi satu jenis informasi tentang struktur internal; kualitas item perlu dinilai dari beberapa bukti.","why_it_seems_true":"Loading menyediakan angka yang mudah diurutkan sehingga item dengan factor loading tinggi terlihat otomatis lebih baik.","explanation":"Factor loading menunjukkan seberapa kuat hubungan item dengan faktor laten dalam model tertentu, tetapi kualitas item tidak dapat dinilai hanya dari satu angka tersebut. Peneliti juga perlu mempertimbangkan cakupan isi, kemiripan item yang berlebihan, cross-loading, ketergantungan lokal antaritem, fungsi kategori respons, keterbacaan, fairness, differential item functioning (DIF), dan keterwakilan konstruk. Menghapus item hanya karena loading sedikit lebih rendah dapat mempersempit cakupan konstruk. Sebaliknya, beberapa item yang hampir identik dapat memiliki loading tinggi tetapi membuat skala terlalu repetitif. Karena itu, keputusan mempertahankan atau menghapus item perlu menggabungkan bukti statistik dan pertimbangan isi.","example":"Lima item yang hampir identik dapat semuanya memiliki factor loading sangat tinggi, tetapi skala menjadi terlalu mirip dan tidak mencakup sisi konstruk lain yang penting.","better_practice":"Gabungkan bukti statistik dengan blueprint dan telaah isi dan tujuan skor interpretasi. Hindari pemilihan item yang hanya mengejar kecocokan/factor loading maksimum.","reference":"Standards for Educational and Psychological Testing","reference_urls":"https://www.testingstandards.net/"},{"category":"Signifikansi Statistik","myth":"p < .05 berarti efeknya penting atau besar.","short_correction":"p-value tidak menunjukkan besar efek atau pentingnya efek secara praktis.","why_it_seems_true":"Kata “signifikan” mudah dibaca sebagai “penting”, padahal signifikansi statistik mempunyai arti teknis yang jauh lebih sempit.","explanation":"p-value menunjukkan seberapa tidak sesuai data yang diamati dengan model statistik tertentu ketika hipotesis nol dan asumsi lain dianggap benar. Nilainya dipengaruhi oleh ukuran sampel dan variasi data. Dengan N yang sangat besar, efek yang sangat kecil dapat menghasilkan p-value yang sangat kecil. Sebaliknya, efek yang secara praktis penting dapat gagal mencapai p < .05 pada sampel kecil. Karena itu, p-value tidak memberi tahu seberapa besar efek, seberapa penting efek secara praktis atau klinis, maupun peluang bahwa hipotesis benar. Interpretasi yang lebih lengkap perlu melihat estimasi efek, interval kepercayaan, desain penelitian, dan konteks substantif.","example":"Perbedaan rata-rata sebesar 0,05 SD dapat menghasilkan p < .001 pada puluhan ribu observasi, tetapi perbedaannya mungkin sangat kecil secara praktis.","better_practice":"Laporkan ukuran efek dalam unit yang dapat dipahami, interval kepercayaan, dan jelaskan apakah besar efek tersebut bermakna secara substantif atau praktis.","reference":"Wasserstein & Lazar (2016); Greenland et al. (2016)","reference_urls":"https://doi.org/10.1080/00031305.2016.1154108|https://doi.org/10.1007/s10654-016-0149-3"},{"category":"Signifikansi Statistik","myth":"p > .05 berarti tidak ada efek.","short_correction":"Hasil yang tidak signifikan tidak membuktikan bahwa efek benar-benar nol.","why_it_seems_true":"Binary signifikan/tidak signifikan reporting membuat hasil p > .05 tampak seperti keputusan bahwa efek = 0.","explanation":"p > .05 dapat terjadi karena banyak alasan: efek memang kecil, ukuran sampel kurang informatif, data sangat bervariasi, model kurang sesuai, atau data memang konsisten dengan efek yang sangat kecil. Tanpa melihat estimasi efek dan interval kepercayaan, kita tidak tahu rentang efek apa yang masih masuk akal berdasarkan data. Interval kepercayaan yang lebar dapat mencakup efek yang bermanfaat, efek yang hampir nol, dan bahkan efek yang merugikan. Jika tujuan penelitian benar-benar ingin menunjukkan bahwa efek cukup kecil untuk dianggap tidak bermakna, pendekatan seperti equivalence testing atau non-inferiority testing dengan batas yang ditentukan sebelumnya biasanya lebih tepat daripada sekadar gagal memperoleh p < .05.","example":"Estimasi d = .30 dengan interval kepercayaan 95% [-.10, .70] dan p > .05 tidak menunjukkan “tidak ada efek”; data masih sesuai dengan rentang efek yang cukup luas.","better_practice":"Laporkan estimasi efek dan interval kepercayaan, bahas ketepatannya, dan gunakan kerangka equivalence/non-inferiority bila tujuan ilmiahnya memang menunjukkan bahwa efek cukup kecil.","reference":"Greenland et al. (2016); Wasserstein, Schirm, & Lazar (2019)","reference_urls":"https://doi.org/10.1007/s10654-016-0149-3|https://doi.org/10.1080/00031305.2019.1583913"},{"category":"Signifikansi Statistik","myth":"p = .049 jauh lebih meyakinkan daripada p = .051.","short_correction":"Batas .05 tidak membuat kekuatan bukti berubah secara tiba-tiba.","why_it_seems_true":"Publication practices dan software sering memberi label “signifikan” hanya berdasarkan apakah p melewati .05.","explanation":"p-value bersifat kontinu. Perbedaan antara .049 dan .051 sangat kecil dan dapat berubah hanya karena sedikit perubahan data, pengkodean, atau spesifikasi model. Memperlakukan .049 sebagai 'berhasil' dan .051 sebagai 'gagal' membuat kesimpulan terlalu bergantung pada satu ambang. Penilaian bukti sebaiknya juga mempertimbangkan besar efek, interval kepercayaan, kualitas desain, bukti sebelumnya, serta banyaknya pengujian yang dilakukan. Ambang .05 dapat berguna sebagai aturan keputusan tertentu, tetapi bukan batas yang membuat kualitas bukti berubah secara mendadak.","example":"Dua replication studies dengan estimasi efek hampir sama dapat memperoleh p = .049 dan p = .051 hanya karena sampling variation. Tidak masuk akal menyebut satu “berhasil” dan satu “tidak ada efek”.","better_practice":"Gunakan p-value sebagai salah satu bagian bukti, laporkan exact value bersama estimasi/interval kepercayaan, dan hindari bahasa yang menciptakan jurang artifisial di sekitar .05.","reference":"Wasserstein & Lazar (2016); Wasserstein, Schirm, & Lazar (2019)","reference_urls":"https://doi.org/10.1080/00031305.2016.1154108|https://doi.org/10.1080/00031305.2019.1583913"},{"category":"Signifikansi Statistik","myth":"Interval kepercayaan 95% berarti ada peluang 95% parameter yang benar berada di interval yang sudah dihitung.","short_correction":"Dalam pendekatan frequentist, parameter dianggap tetap; yang memiliki cakupan 95% adalah prosedur pembentukan interval dalam pengulangan jangka panjang.","why_it_seems_true":"Bahasa “95% confidence” terdengar natural sebagai probabilitas statement tentang parameter setelah interval diamati.","explanation":"Dalam pendekatan frequentist, parameter dianggap tetap sedangkan interval kepercayaan akan berbeda jika pengambilan sampel diulang. Prosedur interval kepercayaan 95% dirancang agar, dalam pengulangan jangka panjang dan jika asumsi model terpenuhi, sekitar 95% interval yang dibentuk mencakup parameter yang sebenarnya. Setelah satu interval tertentu sudah dihitung, interpretasi frequentist tidak mengatakan bahwa ada peluang 95% parameter berada di dalam interval itu. Selain itu, cakupan interval juga bergantung pada model, desain sampling, dan asumsi yang digunakan. Karena itu interval kepercayaan tetap perlu dibaca bersama kemungkinan bias dan kualitas desain.","example":"Kita boleh mengatakan “95% interval kepercayaan adalah [1.2, 2.0] dan prosedur ini mempunyai 95% cakupan di bawah asumsi”, bukan “ada peluang 95% parameter berada antara 1.2 dan 2.0”.","better_practice":"Gunakan bahasa tentang range values yang masih sesuai dengan data/model atau cakupan jangka panjang, dan jelaskan kerangka inferensi yang digunakan.","reference":"Greenland et al. (2016)","reference_urls":"https://doi.org/10.1007/s10654-016-0149-3"},{"category":"Asumsi & Pemeriksaan Model","myth":"Jika Shapiro-Wilk tidak signifikan, data terbukti normal.","short_correction":"Tidak signifikan pada Shapiro-Wilk bukan bukti bahwa distribusi pasti normal.","why_it_seems_true":"Pemeriksaan asumsi sering diajarkan seperti ujian kelulusan: p > .05 = normal, p < .05 = tidak normal.","explanation":"Shapiro-Wilk adalah salah satu cara mendeteksi penyimpangan dari distribusi normal, tetapi hasilnya sangat dipengaruhi ukuran sampel. Pada N kecil, penyimpangan yang cukup besar bisa tidak terdeteksi. Pada N besar, penyimpangan kecil yang secara praktis tidak penting dapat menghasilkan p-value sangat kecil. Lebih penting lagi, banyak analisis tidak mensyaratkan setiap variabel mentah berdistribusi normal. Dalam model linear, normalitas lebih sering berkaitan dengan error atau residual untuk tujuan inferensi tertentu. Karena itu, jangan memakai satu p-value Shapiro-Wilk sebagai 'lampu hijau/lampu merah' universal. Periksa juga grafik, outlier, ukuran sampel, keseimbangan kelompok, dan ketahanan metode yang digunakan.","example":"Pada N = 5000, sedikit skewness dapat menghasilkan p < .001 walaupun penyimpangan tersebut mungkin tidak banyak memengaruhi estimasi. Pada N = 15, data yang sangat skewed dapat saja menghasilkan p > .05.","better_practice":"Periksa distribusi dan residual secara visual, pahami asumsi model yang sebenarnya, pertimbangkan ketahanan hasil atau analisis sensitivitas, dan jangan memakai uji normalitas sebagai tombol otomatis untuk memilih analisis.","reference":"APA JARS–Quant; Greenland et al. (2016)","reference_urls":"https://www.apa.org/pubs/journals/resources/apa-style-jars|https://doi.org/10.1007/s10654-016-0149-3"},{"category":"Asumsi & Pemeriksaan Model","myth":"Semua variabel mentah harus berdistribusi normal agar regresi atau ANOVA boleh digunakan.","short_correction":"Asumsi normalitas biasanya berkaitan dengan error atau residual model, bukan keharusan agar semua variabel mentah normal.","why_it_seems_true":"Checklist software atau buku pengantar kadang menuliskan “uji normalitas variabel” tanpa membedakan distribusi outcome, prediktor, residual, dan sampling distribusi estimator.","explanation":"Regresi linear, t-test, dan ANOVA tidak mensyaratkan semua variabel mentah berdistribusi normal. Pada model linear, asumsi yang lebih relevan biasanya berkaitan dengan bentuk hubungan, struktur error/residual, varians, dan hubungan antarobservasi. Prediktor kontinu tidak harus normal. Outcome juga tidak harus tampak normal secara marginal jika residual model dan metode inferensi masih memadai. Banyak prosedur cukup tahan terhadap penyimpangan normalitas dalam kondisi tertentu, tetapi outlier, heavy tails, heteroskedastisitas, kelompok yang sangat tidak seimbang, atau N yang sangat kecil tetap dapat bermasalah. Jadi, evaluasi asumsi sebaiknya berfokus pada model, bukan sekadar menguji normalitas setiap kolom data.","example":"Usia prediktor dapat sangat skewed namun linear regresi tetap valid jika hubungan conditional dan residual structure dimodelkan dengan baik.","better_practice":"Check residuals/kecocokan model, gunakan robust/Welch/transformasi atau alternative model bila substantif dan diagnostic bukti mendukung, bukan karena satu mentah-variabel normalitas uji.","reference":"APA JARS–Quant; Greenland et al. (2016)","reference_urls":"https://www.apa.org/pubs/journals/resources/apa-style-jars|https://doi.org/10.1007/s10654-016-0149-3"},{"category":"Asumsi & Pemeriksaan Model","myth":"Uji nonparametrik tidak memiliki asumsi.","short_correction":"Uji nonparametrik tetap memiliki asumsi; asumsi tersebut hanya berbeda dari uji parametrik.","why_it_seems_true":"Label “nonparametric” sering disederhanakan menjadi “bebas distribusi”.","explanation":"Uji nonparametrik tidak berarti 'tanpa asumsi'. Metode berbasis peringkat tetap memiliki asumsi tentang cara sampel diperoleh, hubungan antarobservasi, skala pengukuran, dan bentuk distribusi untuk interpretasi tertentu. Misalnya, Mann–Whitney tidak otomatis menjadi uji perbedaan median dalam semua kondisi; interpretasi median membutuhkan kondisi tambahan tentang bentuk distribusi. Kruskal–Wallis juga tidak selalu menjawab pertanyaan yang persis sama dengan one-way ANOVA. Karena itu, keputusan berpindah ke uji nonparametrik sebaiknya didasarkan pada pertanyaan penelitian dan sifat data, bukan hanya karena satu uji normalitas signifikan.","example":"Dua kelompok memiliki shape distribusi sangat berbeda. Mann–Whitney signifikan dapat mencerminkan stochastic urutan atau shape difference, bukan semata perbedaan median.","better_practice":"Tentukan estimand terlebih dahulu, pahami asumsi dan interpretasi dari rank-based uji yang dipilih, dan gunakan robust parametric alternatives bila lebih sesuai dengan pertanyaan.","reference":"APA JARS–Quant; Greenland et al. (2016)","reference_urls":"https://www.apa.org/pubs/journals/resources/apa-style-jars|https://doi.org/10.1007/s10654-016-0149-3"},{"category":"Asumsi & Pemeriksaan Model","myth":"Semua outlier harus dibuang.","short_correction":"Outlier perlu dipahami, bukan otomatis dihapus.","why_it_seems_true":"Data ekstrem terlihat seperti “kesalahan” dan menghapusnya sering membuat analisis terlihat lebih rapi atau lebih signifikan.","explanation":"Outlier dapat berasal dari kesalahan input data, kegagalan pengukuran, heterogenitas populasi, observasi yang jarang tetapi valid, atau ketidaksesuaian spesifikasi model. Menghapus observasi hanya karena nilainya ekstrem dapat mengubah estimand dan memperkenalkan fleksibilitas keputusan analisis peneliti, terutama jika keputusan dibuat setelah melihat hasil. Yang relevan bukan hanya seberapa ekstrem nilainya tetapi pengaruh terhadap estimasi dan apakah observasi berasal dari proses yang menghasilkan data yang ingin dipelajari. Metode robust, transformasi, distribusi alternatif, atau analisis sensitivitas sering lebih informatif daripada penghapusan otomatis.","example":"Seorang peserta memiliki pendapatan jauh lebih tinggi daripada lainnya tetapi datanya valid. Menghapusnya hanya karena boxplot menandainya sebagai outlier dapat menghilangkan bagian nyata dari populasi.","better_practice":"Tentukan aturan kualitas data sebelum melihat outcome bila memungkinkan, verifikasi apakah nilai ekstrem berasal dari kesalahan pencatatan, periksa seberapa besar pengaruhnya terhadap hasil, dan laporkan analisis sensitivitas jika keputusan mengeluarkan data mengubah kesimpulan.","reference":"APA JARS–Quant; Simmons et al. (2011)","reference_urls":"https://www.apa.org/pubs/journals/resources/apa-style-jars|https://doi.org/10.1177/0956797611417632"},{"category":"Regression & Pemodelan","myth":"R² yang tinggi berarti modelnya pasti bagus.","short_correction":"R² hanya menggambarkan sebagian kecocokan model pada data yang dianalisis dan tidak menjamin prediksi yang baik atau model yang tepat.","why_it_seems_true":"R² terlihat seperti persentase “keberhasilan model”, sehingga angka besar terasa sebagai skor kualitas keseluruhan.","explanation":"R² menggambarkan proporsi variasi outcome yang dijelaskan model pada data yang dianalisis. Angka ini tidak menilai apakah hubungan tersebut sebab-akibat, apakah model akan bekerja pada data baru, apakah prediksi terkalibrasi dengan baik, apakah model adil untuk subkelompok tertentu, atau apakah bentuk hubungan antarvariabel sudah tepat. R² juga cenderung meningkat ketika prediktor ditambahkan, termasuk prediktor yang tidak memberi manfaat pada data baru. Karena itu model dapat memiliki R² tinggi akibat overfitting dan tetap memiliki kinerja prediksi yang buruk di luar sampel pembentukan model. Untuk prediksi, validasi dan galat prediksi lebih penting; untuk penjelasan, interpretasi koefisien dan kecocokan asumsi model perlu diperiksa.","example":"Model dengan puluhan prediktor dapat menghasilkan R² = .80 pada sampel pembentukan model tetapi turun drastis ketika diuji pada sampel baru.","better_practice":"Sesuaikan evaluasi dengan tujuan: gunakan validasi, kalibrasi, dan galat prediksi untuk tujuan prediksi; untuk model penjelasan, periksa spesifikasi model, ketidakpastian, serta apakah interpretasi koefisien masuk akal secara substantif.","reference":"Babyak (2004); APA JARS–Quant","reference_urls":"https://doi.org/10.1097/01.psy.0000127692.23278.a9|https://www.apa.org/pubs/journals/resources/apa-style-jars"},{"category":"Regression & Pemodelan","myth":"Semakin banyak kovariat dimasukkan, semakin baik modelnya.","short_correction":"Pemilihan kovariat harus mengikuti tujuan analisis, teori, dan struktur hubungan antarvariabel.","why_it_seems_true":"Menambahkan variabel kontrol terdengar seperti “mengontrol lebih banyak bias” dan software memungkinkan melakukannya dengan mudah.","explanation":"Menambah kovariat dapat meningkatkan ketepatan estimasi atau membantu mengurangi bias akibat variabel perancu pada kondisi tertentu. Namun lebih banyak kovariat tidak selalu lebih baik. Mengontrol mediator dapat mengubah pertanyaan dari efek total menjadi efek langsung, sedangkan mengontrol collider dapat justru memperkenalkan bias. Dalam model prediksi, terlalu banyak prediktor dibandingkan informasi yang tersedia juga meningkatkan risiko overfitting. Karena itu, pemilihan kovariat perlu mengikuti tujuan analisis, teori, urutan waktu, dan struktur hubungan antarvariabel, bukan semata-mata karena variabel tersedia atau karena p-value-nya kecil.","example":"Jika perlakuan memengaruhi motivasi dan motivasi kemudian memengaruhi outcome, mengontrol motivasi dapat menghilangkan sebagian efek total perlakuan yang sebenarnya ingin diestimasi.","better_practice":"Tentukan estimand terlebih dahulu, gunakan pertimbangan substantif dan sebab-akibat untuk memilih kovariat, tentukan sejak awal bila memungkinkan, dan lakukan analisis sensitivitas untuk keputusan yang tidak pasti.","reference":"Hernán & Robins (2020); Babyak (2004)","reference_urls":"https://www.hsph.harvard.edu/miguel-hernan/causal-inference-book/|https://doi.org/10.1097/01.psy.0000127692.23278.a9"},{"category":"Regression & Pemodelan","myth":"Variabel yang berkorelasi dengan outcome sebaiknya selalu dimasukkan sebagai variabel kontrol.","short_correction":"Korelasi dengan outcome saja tidak cukup untuk menentukan apakah suatu variabel perlu dikontrol.","why_it_seems_true":"Stepwise atau “kontrol semua yang signifikan” terasa objektif karena menggunakan aturan statistik yang mudah.","explanation":"Variabel perancu bukan sekadar variabel yang berkorelasi dengan outcome. Dalam analisis sebab-akibat, status suatu variabel sebagai confounder bergantung pada hubungan kausal antarvariabel dan pada efek apa yang ingin diestimasi. Variabel yang sangat berkorelasi dengan outcome dapat ternyata merupakan mediator, collider, atau akibat dari paparan/intervensi sehingga mengontrolnya dapat mengubah atau menambah bias. Sebaliknya, variabel perancu yang penting tetap dapat perlu dimasukkan walaupun korelasinya pada sampel tertentu tidak signifikan. Karena itu, memilih variabel kontrol hanya berdasarkan korelasi atau p-value bivariat bukan strategi yang memadai.","example":"Peneliti mengontrol kepuasan yang diukur setelah perlakuan karena sangat berkorelasi dengan outcome. Jika kepuasan dipengaruhi perlakuan, penyesuaian tersebut dapat mengubah pertanyaan dari efek total menjadi sesuatu yang lebih menyerupai efek langsung.","better_practice":"Gunakan urutan waktu, teori, diagram sebab-akibat (causal diagram) bila sesuai, dan definisi estimand untuk menentukan variabel yang dikontrol. Jangan gunakan p-value bivariat sebagai aturan utama.","reference":"Hernán & Robins (2020)","reference_urls":"https://www.hsph.harvard.edu/miguel-hernan/causal-inference-book/"},{"category":"Regression & Pemodelan","myth":"Variabel kontinu lebih baik dikategorikan agar analisis lebih mudah.","short_correction":"Pengelompokan secara sembarang biasanya membuang informasi dan dapat mengubah interpretasi.","why_it_seems_true":"Label “rendah/tinggi” atau “muda/tua” terasa lebih mudah dijelaskan dan memungkinkan penggunaan t-test atau chi-square sederhana.","explanation":"Mengubah variabel kontinu menjadi kategori seperti 'rendah' dan 'tinggi' memang terlihat lebih sederhana, tetapi biasanya membuang informasi. Peserta dengan skor 49 dan 50 dapat ditempatkan pada kategori berbeda, sementara peserta dengan skor 1 dan 49 justru dianggap sama jika batasnya 50. Pengelompokan seperti median split juga dapat menurunkan power dan membuat hasil sangat bergantung pada cut-off yang dipilih. Jika hubungan tidak linier, solusi yang lebih baik sering kali adalah memodelkan bentuk hubungan tersebut, misalnya dengan transformasi atau spline. Kategorisasi tetap dapat digunakan jika ada batas klinis atau substantif yang jelas, tetapi alasan tersebut perlu dibedakan dari sekadar mempermudah analisis.","example":"Skor self-efficacy 1–100 dibagi menjadi “rendah” dan “tinggi” berdasarkan median. Dua orang dengan skor 49 dan 50 menjadi berbeda kategori, sedangkan 1 dan 49 dianggap sama.","better_practice":"Pertahankan variabel kontinu bila memungkinkan. Jika batas nilai diperlukan, gunakan dasar substantif/klinis yang jelas dan lakukan analisis sensitivitas terhadap spesifikasi.","reference":"Altman & Royston (2006)","reference_urls":"https://doi.org/10.1136/bmj.332.7549.1080"},{"category":"Regression & Pemodelan","myth":"Model dengan banyak prediktor dapat dievaluasi hanya dari signifikansi masing-masing koefisien.","short_correction":"Model dengan beberapa prediktor perlu dievaluasi sebagai sistem, bukan kumpulan p-value masing-masing.","why_it_seems_true":"Tabel regresi menampilkan satu p-value per prediktor sehingga mudah menjadikan kolom signifikansi sebagai evaluasi utama.","explanation":"Signifikansi masing-masing koefisien bukan satu-satunya cara menilai model dengan beberapa prediktor. p-value koefisien dipengaruhi pengkodean, kolinearitas, ukuran sampel, spesifikasi model, serta variabel lain yang masuk ke model. Prediktor yang tidak signifikan dapat tetap penting untuk tujuan prediksi atau penyesuaian, sedangkan prediktor yang signifikan tidak menjamin model akan bekerja pada data baru. Evaluasi model perlu disesuaikan dengan tujuannya: periksa bentuk hubungan dan ketidakpastian untuk model penjelasan, serta lakukan validasi dan evaluasi galat prediksi untuk model prediktif. Pemilihan variabel hanya berdasarkan p-value juga dapat menghasilkan model yang tidak stabil.","example":"Dua highly berkorelasi prediktor masing-masing tidak signifikan ketika dimasukkan bersama, meskipun secara kolektif model menjelaskan informasi penting.","better_practice":"Tentukan sejak awal model berdasarkan tujuan, evaluasi koefisien bersama kecocokan model, pemeriksaan model, dan validasi yang relevan, dan hindari pemilihan stepwise hanya berdasarkan signifikansi sebagai pilihan bawaan.","reference":"Babyak (2004); Simmons et al. (2011)","reference_urls":"https://doi.org/10.1097/01.psy.0000127692.23278.a9|https://doi.org/10.1177/0956797611417632"},{"category":"Data Hilang & Kualitas Data","myth":"Data hilang kurang dari 5% selalu boleh diabaikan.","short_correction":"Persentase kecil tidak menjamin pola data hilang tidak bias.","why_it_seems_true":"Batas nilai 5% mudah dipakai dan pola data hilang yang kecil terlihat tidak berdampak.","explanation":"Dampak data hilang ditentukan bukan hanya oleh persentasenya tetapi juga oleh pola dan mekanisme. Sedikit pola data hilang yang sangat berkaitan dengan outcome atau subkelompok tertentu dapat menghasilkan bias, sedangkan pola data hilang lebih besar kadang dapat ditangani dengan model yang sesuai bila asumsi cukup masuk akal. Analisis complete-case (hanya memakai kasus yang datanya lengkap) juga dapat mengurangi ketepatan dan mengubah populasi sasaran. Karena itu ambang persentase tunggal tidak cukup untuk memilih strategi penanganan.","example":"Hanya 3% data pendapatan yang hilang, tetapi hampir semuanya berasal dari responden dengan pendapatan tertinggi. Mengabaikannya dapat menurunkan estimasi rata-rata secara sistematis.","better_practice":"Deskripsikan jumlah/tingkat dan pola data hilang, pertimbangkan alasan substantif, gunakan metode yang memiliki dasar statistik jelas seperti multiple imputation atau analisis berbasis model bila sesuai, dan lakukan analisis sensitivitas untuk asumsi penting.","reference":"White, Royston, & Wood (2011); APA JARS–Quant","reference_urls":"https://doi.org/10.1002/sim.4067|https://www.apa.org/pubs/journals/resources/apa-style-jars"},{"category":"Data Hilang & Kualitas Data","myth":"Mengganti data hilang dengan rata-rata adalah cara yang aman.","short_correction":"Imputasi rata-rata tunggal merusak varians dan hubungan antarvariabel.","why_it_seems_true":"Mengganti hilang dengan rata-rata sangat mudah dan mempertahankan jumlah kasus sehingga terlihat praktis.","explanation":"Imputasi rata-rata menambahkan nilai yang sama untuk semua observasi yang datanya hilang, mengecilkan varians, mengubah kovarians/korelasi, dan memperlakukan nilai imputasi seolah-olah diketahui tanpa ketidakpastian. Akibatnya galat baku dan hubungan antarvariabel dapat menjadi bias. Pendekatan modern seperti multiple imputation atau metode berbasis model yang menggunakan informasi yang tersedia dirancang untuk mempertahankan ketidakpastian dan struktur hubungan dengan asumsi yang lebih eksplisit. Tidak ada metode yang otomatis benar; pilihan tetap tergantung pada analisis model dan asumsi tentang data hilang.","example":"Jika 15% skor kecemasan diganti dengan rata-rata sampel, distribusi menjadi terlalu terkonsentrasi di tengah dan korelasi kecemasan dengan outcome dapat melemah secara artifisial.","better_practice":"Gunakan metode penanganan data hilang yang memiliki dasar statistik yang masih sesuai dengan analisis, sertakan prediktor yang berkaitan dengan pola data hilang yang relevan, dan dokumentasikan asumsi serta pemeriksaan model.","reference":"White, Royston, & Wood (2011)","reference_urls":"https://doi.org/10.1002/sim.4067"},{"category":"Keputusan Peneliti","myth":"Melakukan banyak uji tidak masalah selama masing-masing memakai alpha .05.","short_correction":"Pengujian multipel meningkatkan peluang positif palsu (false positive) pada sekumpulan analisis.","why_it_seems_true":"Alpha .05 sering dipahami sebagai jaminan bahwa setiap penelitian hanya punya 5% peluang positif palsu (false positive), padahal itu berlaku pada uji tertentu di bawah kondisi tertentu.","explanation":"Jika banyak hipotesis, outcome, subkelompok, spesifikasi model, atau aturan penghentian pengumpulan data dicoba, peluang menemukan setidaknya satu hasil p < .05 secara kebetulan meningkat. Masalah menjadi lebih besar jika hanya hasil yang “berhasil” yang dilaporkan, sementara pembaca tidak mengetahui berapa banyak analisis yang sebenarnya dicoba. Penyesuaian untuk banyak pengujian dapat berguna, tetapi bukan satu-satunya solusi. Menetapkan analisis utama sejak awal, preregistration (mendaftarkan rencana analisis sebelum melihat hasil) bila sesuai, struktur hipotesis yang jelas, dan pelaporan transparan juga penting.","example":"Jika 20 uji dilakukan terhadap hipotesis nol yang semuanya benar dan masing-masing memakai alpha .05, peluang memperoleh setidaknya satu p < .05 jauh lebih besar daripada 5%.","better_practice":"Bedakan analisis utama dan analisis eksploratif, tentukan keputusan penting sejak awal, pertimbangkan penyesuaian untuk banyak pengujian bila sesuai, dan laporkan seluruh kelompok analisis yang relevan.","reference":"Wasserstein & Lazar (2016); Simmons et al. (2011)","reference_urls":"https://doi.org/10.1080/00031305.2016.1154108|https://doi.org/10.1177/0956797611417632"},{"category":"Keputusan Peneliti","myth":"Kalau hanya satu analisis yang akhirnya dilaporkan, masalah banyak pengujian atau fleksibilitas analisis tidak ada.","short_correction":"Fleksibilitas analisis yang tidak dilaporkan tetap dapat meningkatkan risiko positif palsu (false positive).","why_it_seems_true":"Pembaca hanya melihat model akhir sehingga terlihat seperti hanya satu hipotesis uji yang pernah dilakukan.","explanation":"Fleksibilitas keputusan analisis peneliti mencakup keputusan tentang kapan berhenti mengumpulkan data, eksklusi, definisi outcome, kovariat, transformasi, subkelompok, dan spesifikasi model. Jika keputusan dipengaruhi oleh hasil sementara dan hanya jalur analisis akhir yang menghasilkan temuan yang dilaporkan, p-value nominal tidak lagi merepresentasikan seluruh proses pencarian analisis. Bahkan tanpa niat buruk, banyak pilihan yang sama-sama masuk akal dapat membentuk “garden of forking paths (banyak jalur analisis yang mungkin)”. Transparansi dan penetapan rencana analisis sejak awal membantu pembaca memahami proses analisis.","example":"Peneliti mencoba tiga outcome, dua aturan eksklusi, dan empat kombinasi kovariat, lalu melaporkan hanya kombinasi yang menghasilkan p < .05 sebagai “analisis yang direncanakan”.","better_practice":"Preregistrasikan analisis utama bila memungkinkan, dokumentasikan perubahan dari rencana awal, bedakan analisis konfirmatori dan eksploratif, dan gunakan multiverse atau analisis sensitivitas untuk memeriksa spesifikasi alternatif yang masih masuk akal.","reference":"Simmons et al. (2011)","reference_urls":"https://doi.org/10.1177/0956797611417632"},{"category":"Keputusan Peneliti","myth":"Observed/post-hoc power membantu menjelaskan mengapa hasil tidak signifikan.","short_correction":"Observed power yang dihitung dari efek yang teramati biasanya tidak menambah informasi di luar p-value dan estimasi efek.","why_it_seems_true":"Setelah hasil yang tidak signifikan, menghitung “power studi” terasa seperti cara untuk menentukan apakah N terlalu kecil.","explanation":"Post-hoc power yang dihitung dari estimasi efek pada studi yang sama sangat terkait secara matematis dengan p-value yang sudah diperoleh. Jika hasil tidak signifikan, observed power hampir selalu rendah sehingga angka tersebut biasanya tidak memberikan informasi baru. Ia juga tidak dapat membedakan apakah efek sebenarnya kecil atau data hanya sangat bervariasi. Yang lebih informatif adalah estimasi efek dan interval kepercayaan karena keduanya menunjukkan rentang efek yang masih sesuai dengan data. Untuk merencanakan studi berikutnya, gunakan ukuran efek yang dianggap bermakna atau bukti dari penelitian lain, bukan ukuran efek yang diperoleh dari satu studi seolah-olah merupakan nilai yang pasti benar.","example":"Studi memperoleh p = .20 lalu software melaporkan observed power 25%. Angka 25% tidak memberi diagnosis baru di luar hasil p-value dan estimasi/interval kepercayaan.","better_practice":"Interpretasikan estimasi efek dan interval kepercayaan. Untuk studi berikutnya, lakukan analisis sensitivitas atau analisis power berdasarkan efek yang dianggap bermakna atau bukti dari penelitian/literatur lain.","reference":"Greenland et al. (2016); Lakens (2022)","reference_urls":"https://doi.org/10.1007/s10654-016-0149-3|https://doi.org/10.1525/collabra.33267"},{"category":"Keputusan Peneliti","myth":"Jika hasil awal tidak signifikan, menambah sampel sampai p < .05 adalah praktik yang aman.","short_correction":"Menghentikan pengumpulan data berdasarkan hasil sementara dapat mengubah tingkat kesalahan statistik jika tidak direncanakan dalam desain yang sesuai.","why_it_seems_true":"Mengumpulkan lebih banyak data terdengar selalu lebih baik, sehingga keputusan kapan pengumpulan data dihentikan tampak tidak terkait dengan inferensi.","explanation":"Jika peneliti terus melihat p-value selama pengumpulan data lalu berhenti ketika p < .05, karakteristik error dari uji statistik biasa dapat berubah. Tanpa desain sequential yang memang memperhitungkan pemeriksaan berulang, tingkat positif palsu (false positive) dapat meningkat. Analisis sequential sebenarnya dapat valid dan efisien jika aturan penghentian, jumlah pemeriksaan, dan penyesuaian statistik direncanakan sejak awal. Masalahnya bukan menambah data itu sendiri, tetapi keputusan berhenti yang bergantung pada hasil sementara tanpa diperhitungkan dalam analisis dan tanpa dilaporkan secara transparan.","example":"Peneliti mengecek p-value setiap 10 peserta dan berhenti saat p < .05, tetapi menganalisis hasil seolah-olah N akhir sudah ditetapkan sejak awal.","better_practice":"Tentukan aturan kapan pengumpulan data dihentikan sebelum analisis atau gunakan valid desain sequential. Laporkan pemeriksaan hasil sementara dan perubahan rekrutmen secara transparan.","reference":"Simmons et al. (2011); APA JARS–Quant","reference_urls":"https://doi.org/10.1177/0956797611417632|https://www.apa.org/pubs/journals/resources/apa-style-jars"}],"analysisRules":[{"primary":"Statistik deskriptif dan interval estimasi","why":"Tujuan penelitian adalah menggambarkan data, bukan menguji perbedaan atau hubungan antarvariabel.","alternative":"Pilih ringkasan yang sesuai dengan jenis dan bentuk data, misalnya rata-rata dan SD, median dan IQR, proporsi, atau tabel frekuensi.","not":"Jangan menambahkan uji signifikansi jika uji tersebut tidak menjawab pertanyaan penelitian.","effect":"Laporkan ringkasan data dengan jelas. Jika relevan, tambahkan interval kepercayaan untuk menunjukkan ketidakpastian estimasi."},{"primary":"Estimasi dengan interval kepercayaan","why":"Tujuan utama adalah memperkirakan nilai pada populasi, misalnya rata-rata, proporsi, korelasi, atau parameter lain, dengan tingkat ketepatan yang dapat dinilai.","alternative":"Metode estimasi bergantung pada besaran yang ingin dihitung, misalnya rata-rata, proporsi, korelasi, atau parameter model tertentu.","not":"p-value saja tidak menunjukkan seberapa tepat suatu estimasi.","effect":"Utamakan nilai estimasi, interval kepercayaan, dan makna praktisnya."},{"primary":"Regresi linear / ANCOVA dengan indikator kelompok dan kovariat yang sudah direncanakan","why":"Outcome kontinu dibandingkan antara dua kelompok yang terdiri dari peserta berbeda, dan ada prediktor atau kovariat tambahan yang ingin ikut diperhitungkan.","alternative":"Welch t-test dapat digunakan untuk melihat perbedaan dua kelompok tanpa penyesuaian kovariat. Jika memakai model yang disesuaikan, tentukan kovariat berdasarkan alasan teori atau desain, bukan setelah melihat hasil.","not":"Jangan menambahkan kovariat hanya karena membuat p-value menjadi lebih kecil.","effect":"Laporkan perbedaan antarkelompok yang sudah disesuaikan beserta interval kepercayaan. Jelaskan juga kovariat yang dimasukkan dan alasannya."},{"primary":"Independent-samples t-test / uji t dua kelompok independen (pertimbangkan Welch's t-test)","why":"Outcome kontinu dibandingkan antara dua kelompok yang terdiri dari peserta berbeda.","alternative":"Metode yang lebih tahan terhadap pelanggaran asumsi atau metode berbasis peringkat dapat dipertimbangkan jika lebih sesuai dengan pertanyaan penelitian dan karakteristik data.","not":"Paired t-test digunakan untuk dua pengukuran yang saling berpasangan, bukan untuk dua kelompok peserta yang berbeda.","effect":"Laporkan perbedaan rata-rata, interval kepercayaan, dan ukuran efek terstandar jika bermanfaat."},{"primary":"Paired-samples t-test / uji t berpasangan","why":"Dua pengukuran kontinu berasal dari peserta yang sama atau dari pasangan yang memang dipasangkan.","alternative":"Model pengukuran berulang dapat lebih sesuai jika ada data yang hilang, lebih dari dua waktu pengukuran, atau ada prediktor tambahan.","not":"Uji untuk kelompok independen mengabaikan hubungan antara dua pengukuran yang berasal dari orang/pasangan yang sama.","effect":"Laporkan rata-rata selisih berpasangan dan interval kepercayaan."},{"primary":"ANCOVA / regresi linear dengan indikator kelompok dan kovariat yang sudah direncanakan","why":"Outcome kontinu dibandingkan pada lebih dari dua kelompok yang berbeda, sekaligus mempertimbangkan prediktor atau kovariat tambahan.","alternative":"One-way ANOVA atau Welch ANOVA dapat digunakan untuk membandingkan kelompok tanpa penyesuaian kovariat.","not":"Melakukan banyak t-test antar-kelompok lalu hanya memilih hasil yang signifikan meningkatkan risiko positif palsu (false positive).","effect":"Laporkan perbandingan kelompok yang sudah disesuaikan atau rata-rata tersesuaikan (estimated marginal means) dengan interval kepercayaan. Jelaskan juga bagaimana banyak perbandingan ditangani."},{"primary":"One-way ANOVA (pertimbangkan Welch ANOVA jika varians antarkelompok berbeda)","why":"Outcome kontinu dibandingkan pada lebih dari dua kelompok yang terdiri dari peserta berbeda.","alternative":"Regresi linear dengan indikator kelompok memberikan kerangka yang setara dan lebih mudah diperluas jika nanti ada kovariat.","not":"Melakukan banyak t-test antar-kelompok tanpa penyesuaian meningkatkan peluang positif palsu (false positive).","effect":"Laporkan hasil keseluruhan, perbandingan yang direncanakan atau yang sudah disesuaikan untuk perbandingan multipel, serta ukuran efek yang mudah ditafsirkan."},{"primary":"Repeated-measures ANOVA atau mixed-effects model","why":"Outcome kontinu diukur berulang pada orang yang sama dalam lebih dari dua kondisi atau waktu.","alternative":"Mixed-effects model biasanya lebih fleksibel jika ada data hilang, jumlah pengukuran tidak sama, atau jarak waktu berbeda.","not":"One-way ANOVA biasa memperlakukan semua pengukuran seolah-olah berasal dari orang yang berbeda.","effect":"Laporkan perubahan atau perbandingan yang diestimasi beserta interval kepercayaan."},{"primary":"Analisis tabel kontingensi, misalnya uji chi-square independensi","why":"Outcome dan variabel pengelompok sama-sama berbentuk kategorikal.","alternative":"Regresi logistik atau regresi multinomial lebih sesuai jika ingin memasukkan kovariat atau mendapatkan hubungan yang sudah disesuaikan.","not":"t-test dirancang untuk outcome kuantitatif, bukan jumlah/frekuensi kategori.","effect":"Laporkan proporsi tiap sel dan ukuran hubungan, misalnya odds ratio atau Cramer's V, bila sesuai."},{"primary":"Regresi linear berganda","why":"Outcome utama kontinu dan ada lebih dari satu prediktor/kovariat yang ingin dianalisis bersama.","alternative":"Korelasi bivariat tetap berguna untuk melihat hubungan tanpa penyesuaian. Pada regresi, periksa bentuk hubungan, kolinearitas, interaksi yang memang direncanakan, dan alasan memasukkan setiap kovariat.","not":"Koefisien yang sudah disesuaikan tidak otomatis menunjukkan efek sebab-akibat. Maknanya bergantung pada variabel yang dimasukkan, cara pengkodean, urutan waktu, dan asumsi substantif.","effect":"Laporkan slope atau koefisien beserta interval kepercayaan, informasi model yang relevan, dan daftar prediktor/kovariat yang masuk model."},{"primary":"Korelasi dan/atau regresi linear sederhana","why":"Dua variabel utama berupa data kuantitatif dan tujuan penelitian adalah menilai hubungan di antara keduanya.","alternative":"Korelasi Spearman dapat digunakan untuk hubungan monotonik berbasis peringkat. Regresi berguna jika ingin memodelkan hubungan lebih lanjut atau menambahkan kovariat.","not":"Korelasi tidak dengan sendirinya menunjukkan hubungan sebab-akibat.","effect":"Laporkan koefisien korelasi atau slope regresi beserta interval kepercayaan, bukan hanya p-value."},{"primary":"Regresi logistik biner","why":"Outcome hanya memiliki dua kategori dan tujuan penelitian adalah menilai hubungannya dengan satu atau lebih prediktor.","alternative":"Jika hanya ada satu prediktor kategorikal sederhana, tabel 2×2 dapat digunakan untuk melihat hubungan tanpa penyesuaian.","not":"Regresi linear biasa dapat menghasilkan prediksi yang tidak sesuai untuk outcome biner.","effect":"Laporkan odds ratio atau probabilitas yang diprediksi beserta interval kepercayaan atau ukuran ketidakpastiannya."},{"primary":"Regresi linear / pemodelan prediktif","why":"Outcome kontinu dan tujuan utama adalah memprediksi nilainya dari satu atau lebih prediktor.","alternative":"Pemilihan model perlu mempertimbangkan bentuk hubungan, cara validasi, dan situasi tempat model akan digunakan.","not":"R² pada data yang sama dengan data pembentukan model belum cukup untuk menunjukkan bahwa model akan bekerja baik pada data baru.","effect":"Jika tujuan utamanya prediksi, laporkan galat prediksi dan hasil validasi, bukan hanya koefisien model."},{"primary":"Regresi logistik biner / klasifikasi probabilistik","why":"Outcome biner dan tujuan penelitian adalah memprediksi peluang terjadinya suatu kejadian.","alternative":"Metode prediksi lain dapat digunakan, tetapi tetap perlu diuji pada data yang tidak dipakai untuk membangun model atau melalui prosedur validasi yang sesuai.","not":"Akurasi klasifikasi saja dapat menyesatkan, terutama jika salah satu kategori jauh lebih banyak daripada kategori lain.","effect":"Pertimbangkan diskriminasi, kalibrasi, dan galat prediksi."},{"why":"Outcome mempunyai urutan kategori dan tujuan penelitian adalah membandingkan kelompok yang berbeda.","alternative":"Regresi ordinal dapat memodelkan peluang tiap kategori dan memasukkan kovariat. Uji berbasis peringkat menjawab pertanyaan berbasis peringkat/distribusi sesuai asumsi masing-masing.","not":"Skala ordinal yang pendek tidak otomatis dapat diperlakukan sebagai kontinu tanpa mempertimbangkan makna kategori dan distribusinya.","effect":"Laporkan ringkasan tiap kelompok dan ukuran efek yang sesuai dengan model ordinal atau berbasis peringkat yang digunakan.","primary":"Perbandingan outcome ordinal: pertimbangkan Mann-Whitney/Wilcoxon rank-sum atau regresi ordinal"},{"primary":"Regresi ordinal, atau hubungan berbasis peringkat untuk hubungan bivariat sederhana","why":"Outcome memiliki kategori yang berurutan. Analisis sebaiknya mempertahankan urutan tersebut tanpa langsung menganggap jarak antar-kategori sama.","alternative":"Untuk hubungan monotonik sederhana antara dua variabel berurutan/kuantitatif, Spearman korelasi dapat menjawab pertanyaan yang lebih sempit.","not":"Ordinary least squares (OLS) menganggap jarak antar-nilai bermakna seperti skala interval, yang belum tentu sesuai untuk outcome ordinal.","effect":"Laporkan perbandingan odds atau probabilitas dari model atau hubungan berbasis peringkat beserta interval kepercayaan jika memungkinkan."},{"primary":"Regresi logistik multinomial","why":"Outcome memiliki lebih dari dua kategori yang tidak berurutan dan tujuan penelitian adalah menilai hubungan atau melakukan prediksi.","alternative":"Jika kategori sebenarnya memiliki urutan yang jelas, ordinal model mungkin lebih efisien dan lebih mudah ditafsirkan.","not":"Regresi logistik biner hanya untuk dua kategori. Menggabungkan kategori hanya agar menjadi biner dapat membuang informasi.","effect":"Laporkan perbandingan peluang antar-kategori atau probabilitas yang diprediksi beserta interval kepercayaan atau ukuran ketidakpastiannya."},{"primary":"Regresi dengan pengkodean prediktor ordinal yang dapat dipertanggungjawabkan, atau korelasi Spearman","why":"Prediktor memiliki urutan, tetapi jarak antar-kategori belum tentu sama.","alternative":"Perlakukan prediktor sebagai faktor jika tidak ingin menganggap jarak antar-kategori bersifat linear.","not":"Memberi kode 1, 2, 3, dan seterusnya secara otomatis membuat asumsi bahwa perubahan antar-kategori mengikuti pola tertentu.","effect":"Laporkan contrast, slope, atau hubungan berbasis peringkat yang digunakan dan jelaskan bagaimana prediktor ordinal direpresentasikan."},{"primary":"Analisis mediasi dalam model yang didasari teori","why":"Pertanyaan penelitian berfokus pada mekanisme yang diduga menghubungkan prediktor/paparan dengan outcome.","alternative":"Desain longitudinal atau eksperimen biasanya memberi informasi urutan waktu dan sebab-akibat yang lebih kuat daripada mediasi pada satu kali pengukuran.","not":"Efek tidak langsung (indirect effect) yang signifikan pada data cross-sectional tidak otomatis membuktikan mekanisme sebab-akibat.","effect":"Laporkan efek tidak langsung beserta interval kepercayaan atau ukuran ketidakpastiannya dan jelaskan asumsi yang diperlukan untuk menafsirkannya."},{"primary":"Model perubahan kelompok dari waktu ke waktu (group-by-time) / mixed-effects model","why":"Evaluasi intervensi dengan pengukuran berulang perlu memperhitungkan perubahan dari waktu ke waktu dan hubungan antar-pengukuran pada peserta yang sama.","alternative":"ANCOVA pada posttest dengan penyesuaian baseline dapat efisien pada desain acak yang sesuai.","not":"Menguji signifikansi secara terpisah di tiap kelompok tidak sama dengan menguji apakah efek intervensi berbeda antarkelompok.","effect":"Laporkan efek antarkelompok atau contrast group-by-time beserta interval kepercayaan."},{"primary":"Perbandingan antarkelompok atau model regresi yang sesuai dengan desain eksperimen acak/quasi-eksperimen","why":"Analisis utama seharusnya mengestimasi perbedaan kondisi/intervensi yang memang didefinisikan oleh desain penelitian.","alternative":"Penyesuaian kovariat dapat meningkatkan ketepatan estimasi jika direncanakan sebelumnya dan digunakan secara tepat.","not":"Jangan memilih analisis hanya karena salah satu uji menghasilkan p-value yang lebih kecil.","effect":"Laporkan estimasi efek intervensi beserta interval kepercayaan dan jelaskan peserta mana yang termasuk dalam analisis."},{"primary":"Informasi tambahan masih diperlukan","why":"Kombinasi tujuan penelitian dan jenis variabel saat ini belum cukup untuk menentukan satu keluarga analisis utama.","alternative":"Perjelas jenis outcome, struktur prediktor, apakah data saling berhubungan/berulang, dan besaran apa yang sebenarnya ingin diestimasi.","not":"Jangan memaksakan uji statistik yang familiar jika uji tersebut sebenarnya tidak menjawab pertanyaan penelitian.","effect":"Nyatakan secara spesifik nilai atau perbandingan apa yang ingin dihasilkan oleh analisis."}],"designRules":[{"name":"Eksperimen acak dengan pengukuran berulang","family":"Eksperimental","strength":"Peserta ditempatkan secara acak ke kondisi, lalu outcome diukur beberapa kali pada orang yang sama. Desain ini dapat digunakan untuk membandingkan efek intervensi sekaligus melihat perubahan dari waktu ke waktu.","caution":"Analisis harus memperhitungkan bahwa pengukuran dari orang yang sama saling berkaitan. Kehilangan peserta, pelaksanaan intervensi, data hilang, dan definisi perbandingan antarkondisi juga perlu direncanakan.","ref":"CONSORT 2025; APA JARS-Quant"},{"name":"Eksperimen acak dengan pengukuran cross-sectional berulang","family":"Eksperimental","strength":"Kondisi intervensi ditentukan secara acak dan outcome diukur pada beberapa waktu, tetapi peserta yang diukur dapat berbeda pada setiap waktu.","caution":"Jangan memperlakukan data sebagai pengukuran berulang pada individu jika orang yang diukur berbeda di setiap waktu. Jika pengacakan dilakukan pada kelas, sekolah, atau kelompok lain, pengelompokan tersebut juga harus diperhitungkan dalam analisis.","ref":"CONSORT 2025; APA JARS-Quant"},{"name":"Eksperimen acak antar-kelompok","family":"Eksperimental","strength":"Peserta ditempatkan secara acak ke kelompok. Jika proses pengacakan dan pelaksanaan berjalan baik, desain ini memberi dasar yang kuat untuk membandingkan efek intervensi antarkelompok.","caution":"Pengacakan tidak menjamin penelitian bebas masalah. Kepatuhan terhadap intervensi, data hilang, kualitas pengukuran, dan apakah hasil dapat digeneralisasikan ke populasi lain tetap perlu diperhatikan.","ref":"CONSORT 2025; APA JARS-Quant"},{"name":"Quasi-experiment dengan pengukuran berulang","family":"Quasi-experimental","strength":"Intervensi diberikan, tetapi peserta tidak ditempatkan secara acak. Pengukuran berulang pada orang yang sama dapat membantu melihat perubahan sebelum dan sesudah intervensi.","caution":"Kelompok mungkin sudah berbeda sejak awal. Perubahan dari waktu ke waktu, variabel perancu, regression to the mean, dan hubungan antar-pengukuran pada orang yang sama perlu diperhitungkan.","ref":"APA JARS-Quant"},{"name":"Quasi-experiment dengan pengukuran cross-sectional berulang","family":"Quasi-experimental","strength":"Desain ini dapat digunakan untuk melihat perubahan pada tingkat kelompok atau populasi di sekitar suatu intervensi ketika peserta yang diukur berbeda pada setiap waktu.","caution":"Perubahan hasil dapat berasal dari intervensi, tetapi juga dapat muncul karena komposisi sampel berubah atau ada perubahan lain dari waktu ke waktu. Analisis harus mengikuti cara sampel benar-benar dikumpulkan.","ref":"APA JARS-Quant"},{"name":"Quasi-experiment","family":"Quasi-experimental","strength":"Desain ini digunakan ketika peneliti memberikan intervensi tetapi penempatan peserta ke kondisi tidak dilakukan secara acak.","caution":"Perbedaan awal antarkelompok dan variabel perancu dapat memengaruhi hasil. Karena itu desain kelompok pembanding dan strategi analisis perlu direncanakan dengan hati-hati.","ref":"APA JARS-Quant"},{"name":"Studi observasional longitudinal","family":"Observasional","strength":"Orang yang sama diukur beberapa kali. Desain ini memungkinkan peneliti melihat perubahan dalam diri individu dan urutan waktu dengan lebih baik daripada penelitian satu kali pengukuran.","caution":"Urutan waktu saja belum membuktikan hubungan sebab-akibat. Variabel perancu, kesalahan pengukuran, dan kehilangan peserta dari waktu ke waktu tetap dapat memengaruhi hasil.","ref":"STROBE; APA JARS-Quant"},{"name":"Studi observasional cross-sectional berulang","family":"Observasional","strength":"Data dikumpulkan beberapa kali, tetapi sampel pada setiap waktu dapat terdiri dari orang yang berbeda. Desain ini berguna untuk melihat perubahan pada tingkat kelompok atau populasi.","caution":"Perubahan yang terlihat dapat terjadi karena kondisi populasi berubah atau karena orang yang masuk sampel berbeda. Jangan menganalisisnya seolah-olah orang yang sama diikuti dari waktu ke waktu.","ref":"STROBE; APA JARS-Quant"},{"name":"Studi observasional cross-sectional","family":"Observasional","strength":"Data dikumpulkan pada satu periode tanpa memberikan intervensi. Desain ini cocok untuk mendeskripsikan data, membandingkan kelompok, menilai hubungan antarvariabel, atau melakukan prediksi.","caution":"Karena semua informasi biasanya dikumpulkan pada waktu yang sama, urutan sebab dan akibat sering tidak jelas. Desain ini tidak cukup untuk membuktikan hubungan sebab-akibat dengan sendirinya.","ref":"STROBE; APA JARS-Quant"}]};

/* Metodologi inti, port dari rules_*.R dan sample_size_functions.R */
(function(global){

const rules=()=>global.QRM_DATA;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
function design(s){

 const exp=s.intervention==='Yes';
 let index;
 if(exp){ if(s.randomized==='Yes') index=same?0:repeated?1:2; else index=same?3:repeated?4:5; }
 else index=same?6:repeated?7:8;

}
function analysis(s){
 const obj=s.analysis_objective||s.objective||'Associate',o=s.outcome_scale,p=s.predictor_scale,g=Number(s.groups)||2,obs=s.observations;
 const ext=(s.additional_variables||[]).filter(x=>x.name&&x.name.trim());
 const extra=ext.filter(x=>['Additional predictor','Covariate','Moderator'].includes(x.role)).length;
 const cov=ext.some(x=>x.role==='Covariate');
 let i=21;
 if(obj==='Describe')i=0;

 }

 else if(obj==='Associate'){
  if(o==='Continuous'&&p==='Continuous')i=(cov||extra)?9:10;
  else if(o==='Binary')i=11;
  else if(o==='Ordinal')i=15;

 }

  if(o==='Continuous')i=12;

 }
 if(i===21&&obj==='Compare'&&o==='Ordinal'&&['Binary','Categorical'].includes(p))i=14;
 if(i===21&&obj==='Explain mechanism')i=18;
 if(i===21&&obj==='Evaluate intervention')i=obs==='Repeated / paired'?19:20;

// Acklam's inverse standard normal with one Newton correction.
function normCdf(x){ const s=x<0?-1:1; let t=1/(1+0.2316419*Math.abs(x));let d=0.3989422804014327*Math.exp(-x*x/2);let p=d*t*(0.319381530+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));return s===1?1-p:p; }
function normInv(p){if(p<=0)return -Infinity;if(p>=1)return Infinity;
 const a=[-39.6968302866538,220.946098424521,-275.928510446969,138.357751867269,-30.6647980661472,2.50662827745924];
 const b=[-54.4760987982241,161.585836858041,-155.698979859887,66.8013118877197,-13.2806815528857];
 const c=[-0.00778489400243029,-0.322396458041136,-2.40075827716184,-2.54973253934373,4.37466414146497,2.93816398269878];
 const d=[0.00778469570904146,0.32246712907004,2.445134137143,3.75440866190742];
 let q,r,x;
 if(p<.02425||p>1-.02425){q=Math.sqrt(-2*Math.log(p<.5?p:1-p));let num=(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]);let den=((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);x=(p<.5?1:-1)*num/den;}
 else{q=p-.5;r=q*q;let num=(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q;let den=(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);x=num/den;}
 return x;
}
function logGamma(z){let c=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.6150291621406,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];if(z<.5)return Math.log(Math.PI)-Math.log(Math.sin(Math.PI*z))-logGamma(1-z);z-=1;let x=c[0];for(let i=1;i<9;i++)x+=c[i]/(z+i);let t=z+7.5;return 0.9189385332046727+(z+.5)*Math.log(t)-t+Math.log(x);}
function betaCF(a,b,x){const tiny=1e-30, eps=3e-12;let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<tiny)d=tiny;d=1/d;let h=d;for(let m=1;m<=240;m++){let m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<tiny)d=tiny;c=1+aa/c;if(Math.abs(c)<tiny)c=tiny;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<tiny)d=tiny;c=1+aa/c;if(Math.abs(c)<tiny)c=tiny;d=1/d;let del=d*c;h*=del;if(Math.abs(del-1)<eps)break;}return h;}
function ibeta(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const t=Math.exp(logGamma(a+b)-logGamma(a)-logGamma(b)+a*Math.log(x)+b*Math.log1p(-x));return clamp(x<(a+1)/(a+b+2)?t*betaCF(a,b,x)/a:1-t*betaCF(b,a,1-x)/b,0,1);}
function fCdf(f,df1,df2){if(f<=0)return 0;return ibeta(df1*f/(df1*f+df2),df1/2,df2/2);}
function fInv(p,df1,df2){let lo=0,hi=2;while(fCdf(hi,df1,df2)<p&&hi<1e10)hi*=2;for(let i=0;i<57;i++){let mid=(lo+hi)/2;if(fCdf(mid,df1,df2)>=p)hi=mid;else lo=mid;}return hi;}
function noncentralFCdf(f,df1,df2,ncp){if(f<=0)return 0;let xx=df1*f/(df1*f+df2),lam=Math.max(0,ncp)/2;if(lam<1e-12)return ibeta(xx,df1/2,df2/2);
 // Center Poisson sum on its mode: stable for moderate-large lambda.
 let k0=Math.floor(lam);if(k0>8000){const mu=(df1+ncp)/df1;return f<mu*.65?0:f>mu*1.35?1:fCdf(f*df1/(df1+ncp),df1,df2);}
 let prob=Math.exp(-lam+k0*Math.log(lam)-logGamma(k0+1));let res=prob*ibeta(xx,df1/2+k0,df2/2);
 let pk=prob;for(let k=k0-1;k>=0;k--){pk*= (k+1)/lam;if(pk<1e-13&&k<k0-Math.sqrt(lam)*12)break;res+=pk*ibeta(xx,df1/2+k,df2/2);}
 pk=prob;for(let k=k0+1;k<k0+Math.max(80,Math.sqrt(lam)*16);k++){pk*=lam/k;if(pk<1e-13&&k>k0+Math.sqrt(lam)*12)break;res+=pk*ibeta(xx,df1/2+k,df2/2);}
 return clamp(res,0,1);
}
function fPower(n,df1,f2,alpha=.05){let df2=n-df1-1;if(df2<=1)return 0;let critical=fInv(1-alpha,df1,df2);return clamp(1-noncentralFCdf(critical,df1,df2,f2*n),0,1);}
function tPower(totalN,d,paired=false,alpha=.05){let each=paired?totalN:Math.floor(totalN/2),df=paired?each-1:2*each-2;if(df<=0)return 0;let lambda=paired?d*d*each:d*d*each/2;let crit=fInv(1-alpha,1,df);return clamp(1-noncentralFCdf(crit,1,df,lambda),0,1);}
function anovaPower(totalN,f,groups=3,alpha=.05){let n=Math.floor(totalN/groups);if(n<2)return 0;let df1=groups-1,df2=groups*(n-1);let crit=fInv(1-alpha,df1,df2);return 1-noncentralFCdf(crit,df1,df2,groups*n*f*f);}
function binaryFind(f,lower,upper,target=.8){for(let i=0;i<45;i++){let mid=(lower+upper)/2;if(f(mid)>=target)upper=mid;else lower=mid;}return upper;}
const sample={
 correlation:(r=.3,alpha=.05,power=.8)=>Math.ceil(((normInv(1-alpha/2)+normInv(power))/Math.atanh(clamp(Math.abs(r),.01,.95)))**2+3),
 proportion:(p=.5,margin=.05,confidence=.95)=>Math.ceil(normInv((1+confidence)/2)**2*clamp(p,.01,.99)*(1-clamp(p,.01,.99))/clamp(margin,.005,.4)**2),
 mean:(sd=1,margin=.2,confidence=.95)=>Math.ceil((normInv((1+confidence)/2)*Math.max(Math.abs(sd),1e-6)/Math.max(Math.abs(margin),1e-6))**2),

  inner+=slider('alpha','Alpha',.01,.10,.01)+slider('power','Target power',.60,.99,.01)+field('effect_basis','Dasar memilih ukuran efek',{placeholder:'Efek terkecil yang penting, meta-analisis, studi pilot...'});

  inner+=sel('confidence','Tingkat kepercayaan',{'0.9':'90%','0.95':'95%','0.99':'99%'})+radios('finite_known','Apakah populasi diketahui dan dipilih tanpa penggantian?',{'No':'Tidak / populasi besar','Yes':'Ya'});

 }
 return inner+slider('loss_pct','Perkiraan nonrespons / dropout / data tidak dapat digunakan',0,60,5,s,'%')+'<button class="btn primary" data-action="calc-sample">Hitung rencana N</button>';
}

function calcSample(){let goal=s.ss_goal,n=NaN,trace=[],warnings=[],refs=[],noteText='';let loss=Math.min(60,Math.max(0,Number(s.loss_pct)||0))/100;
 if(goal==='Detect an effect'){
  const effect=Number(s.effect),alpha=Number(s.alpha),power=Number(s.power),test=s.power_test;
  if(test==='Correlation')n=L.sample.correlation(effect,alpha,power);
  if(test==='Two independent means')n=L.sample.tTest(effect,alpha,power,false);
  if(test==='Paired means')n=L.sample.tTest(effect,alpha,power,true);
  if(test==='One-way ANOVA')n=L.sample.anova(effect,Number(s.anova_groups),alpha,power);
  if(test==='Multiple regression')n=L.sample.regression(effect,Number(s.predictors),alpha,power);
  trace.push(`N dari analisis power sebelum pengumpulan data: ${n}`);
  noteText=`Perencanaan berdasarkan analisis power untuk ${TESTS[test]}; alpha = ${alpha}, target power = ${power}. ${s.effect_basis.trim()?`Dasar ukuran efek: ${s.effect_basis.trim()}.`:''}`;
  if(!s.effect_basis.trim())warnings.push('Jelaskan dasar memilih ukuran efek: efek terkecil yang relevan, literatur, atau studi pilot.');
  refs.push('Lakens (2022) — Sample Size Justification');
 }else if(goal==='Estimate a proportion precisely'||goal==='Estimate a mean precisely'){
  let p=Number(s.prop),conf=Number(s.confidence);
  if(goal==='Estimate a proportion precisely'){n=L.sample.proportion(p,Number(s.margin),conf);noteText=`Perencanaan ketepatan estimasi proporsi: p = ${p}, margin ±${s.margin}, tingkat kepercayaan ${fmt(conf*100)}%.`;refs=['NIST/SEMATECH e-Handbook','United Nations Statistics Division (2026)'];}
  else{n=L.sample.mean(Number(s.expected_sd),Number(s.mean_margin),conf);noteText=`Perencanaan ketepatan rata-rata: SD = ${s.expected_sd}, margin ±${s.mean_margin}, tingkat kepercayaan ${fmt(conf*100)}%.`;refs=['Perencanaan interval kepercayaan','United Nations Statistics Division (2026)'];}
  trace.push(`N awal untuk sampling acak sederhana / populasi besar: ${n}`);
  let finite=s.finite_known==='Yes',population=Math.max(1,Math.ceil(Number(s.population_n))),fpcPossible=['Simple random sampling','Stratified random sampling','Systematic sampling'].includes(s.sampling_method);
  if(finite&&fpcPossible){n=L.sample.fpc(n,population);trace.push(`Setelah koreksi populasi terbatas (FPC): ${n}`);noteText+=` FPC diterapkan pada populasi N = ${population} dengan asumsi sampling probabilitas tanpa penggantian.`;}
  else{trace.push('FPC tidak diterapkan');if(finite)warnings.push(s.sampling_method==='Cluster sampling'?'FPC sederhana tidak diterapkan secara otomatis untuk cluster sampling; perlu mempertimbangkan tahap sampling.':'FPC tidak diterapkan pada nonprobability sampling atau sensus karena tidak sesuai dengan asumsi perhitungan.');}
  let deff=Math.max(.01,Number(s.design_effect)||1);n=Math.ceil(n*deff);trace.push(`Setelah efek desain (DEFF = ${deff}): ${n}`);
  if(s.sampling_method==='Cluster sampling')warnings.push('Untuk cluster sampling, periksa jumlah cluster, ICC, dan kebutuhan perencanaan ukuran sampel khusus.');
 }else if(goal==='Measure population'){
  let pop=Math.max(1,Math.ceil(Number(s.population_n))),coverage=Number(s.coverage_pct)/100;n=Math.min(pop,Math.ceil(pop*coverage));trace=[`Jumlah populasi N = ${pop}`,`Target cakupan ${fmt(coverage*100)}%`,`Target unit dianalisis = ${n}`];noteText=`Rencana mengukur ${fmt(coverage*100)}% dari populasi terbatas (N = ${pop}); lakukan sensus jika seluruh anggota benar-benar dapat diukur.`;refs=['Lakens (2022) — Measuring (almost) the entire population'];
 }else{
  n=Math.max(10,Math.ceil(Number(s.resource_n)||150));let [label,effect]=L.sample.sensitivity(s.sensitivity_test,n,Number(s.sens_alpha),Number(s.sens_power),Number(s.sens_groups),Number(s.sens_predictors));let eps=`${label} ≈ ${effect.toFixed(2)}`;trace=[`N maksimal dianalisis: ${n}`,`Efek terkecil yang dapat dideteksi: ${eps}, dengan alpha = ${s.sens_alpha}, power = ${s.sens_power}`];noteText=`Perencanaan berbasis keterbatasan sumber daya: dengan N = ${n}, efek terkecil yang dapat dideteksi kira-kira ${eps} untuk ${TESTS[s.sensitivity_test]}. Ini bukan estimasi ukuran efek yang sebenarnya di populasi.`;refs=['Lakens (2022) — perencanaan berbasis sumber daya dan analisis sensitivitas'];
 }
 if(!Number.isFinite(n)||n<1){toast('Perhitungan tidak dapat dilakukan. Periksa parameter yang dimasukkan.');return;}
 let recruit=Math.ceil(n/Math.max(1-loss,.01));if(goal==='Measure population')recruit=Math.min(recruit,Math.ceil(Number(s.population_n)));
 if(loss>0)trace.push(`Penyesuaian nonrespons/dropout ${fmt(loss*100)}%: target rekrutmen N = ${recruit}`);
 Object.assign(s,{analysis_n:n,planned_n:recruit,sample_size_note:noteText,sample_size_trace:trace,sample_size_references:refs,sample_warnings:warnings});preserve();render();toast('Perhitungan ukuran sampel selesai.');
}

let strategy=s.measure_type==='Psychological construct'?{'Existing instrument':'Menggunakan instrumen yang sudah ada','Adapt an instrument':'Mengadaptasi instrumen','Develop a new instrument':'Mengembangkan instrumen baru','Single objective indicator':'Menggunakan satu indikator objektif'}:{'Existing measure/procedure':'Menggunakan ukuran/prosedur yang sudah ada','Develop a new procedure':'Mengembangkan prosedur baru','Administrative record':'Catatan administratif','Direct observation':'Observasi langsung'};
